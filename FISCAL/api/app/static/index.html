<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Departamento de Estudios Económicos BCRP-IQT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/estilo.css">
<link rel="icon" type="image/png" href="/static/favicon.png">
</head>
<body>
<header class="top">
  <div class="brand"><img class="mark logo" src="/static/logo_bcrp.png" alt="Logo del BCRP" width="40" height="40"><div><b>Departamento de Estudios Económicos</b><span>BCRP · Sucursal Iquitos · Síntesis de Actividad Económica</span></div></div>
  <nav class="grupos" id="grupos" aria-label="Regiones"></nav>
  <div class="hasta" id="datos-hasta"></div>
</header>

<div class="selector-movil"><label class="campo" for="sel-movil">Sección</label><select id="sel-movil"></select></div>

<div class="marco" id="marco">
  <nav class="indice" aria-label="Índice">
    <div class="ind-cab"><h2 id="indice-t">Índice</h2><button class="ocultar" type="button" id="ocultar">Ocultar</button></div>
    <div id="indice"></div>
    <div class="leyenda" id="leyenda">
      <span><i class="dot ok"></i>Con datos en la página</span>
      <span><i class="dot vacio"></i>Conectado, falta cargar o conectar</span>
      <span><i class="dot falta"></i>Por construir</span>
    </div>
  </nav>
  <main class="sector" id="sector" tabindex="-1"><div class="cuerpo"><div class="loading"><span class="spin"></span>Cargando…</div></div></main>
</div>

<script src="/static/bcrp.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const NOMBRE_MES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Setiembre", "Octubre", "Noviembre", "Diciembre"];
  const etqMes = (ym) => ym && ym.length === 7 ? `${NOMBRE_MES[+ym.slice(5) - 1]} ${ym.slice(0, 4)}` : (ym || "—");
  const fmt = (v) => v == null ? "" : Math.round(v).toLocaleString("es-PE");
  const fmt3 = (v) => v == null ? "" : v.toLocaleString("es-PE", { maximumFractionDigits: 3 });
  const pct = (v) => v == null ? "n.d." : v.toLocaleString("es-PE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fecha = (f) => new Date(f).toLocaleString("es-PE", { dateStyle: "medium", timeStyle: "short" });
  const titulo = (n) => (n.charAt(0) + n.slice(1).toLowerCase().replace(/ (\S)/g, (m, c) => " " + c.toUpperCase())).replace(/ De /g, " de ");
  async function api(url, opciones) {
    const r = await fetch(url, opciones);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : `El servidor respondió ${r.status}.`);
    return j;
  }

  // ── Regiones, sectores e índices (síntesis de junio 2026) ──
  const REG = { lor: { nombre: "Loreto", corto: "LOR", cod: "16", pesca: "pesca-loreto" },
                smn: { nombre: "San Martín", corto: "SMN", cod: "22", pesca: "pesca-san-martin" },
                uca: { nombre: "Ucayali", corto: "UCA", cod: "25", pesca: "pesca-ucayali" } };
  const LSU = ["16", "22", "25"];
  const INV = ["inv-dev-funcion", "inv-dev-municipalidad", "inv-dev-fuente", "inv-pim-funcion", "inv-pim-municipalidad"];
  const GASTO = ["gasto-dev-generica", "gasto-dev-fuente"];
  const S = {
    resumen: { t: "Resumen ejecutivo", estado: "falta", fuente: "Todos los sectores del informe", entra: "Se arma con los demás sectores",
      lead: "Principales hechos de importancia y el Cuadro 1 (otros indicadores) del mes.", cuadros: ["Principales hechos de importancia", "Cuadro 1 · Otros indicadores"] },
    agro: { t: "Sector agropecuario", estado: "falta", fuente: "MIDAGRI y direcciones regionales de agricultura", entra: "Archivo mensual",
      lead: "Producción de los principales cultivos y crianzas, y avance de siembras de la campaña.", cuadros: ["Producción agropecuaria (t)", "Superficie sembrada (ha)", "Anexo de producción agrícola"] },
    pesca: { t: "Sector pesca", fuente: "DIREPRO de la región", entra: "Subiendo en la página el Excel que envía DIREPRO", bases: (r) => [r.pesca], actualizar: "subir",
      lead: "Desembarque por estado y especie, peces ornamentales y VBP a precios de 2007.", cuadros: "pesca" },
    hidro: { t: "Sector hidrocarburos", fuente: "PERUPETRO, producción fiscalizada y canon petrolero", entra: "Flujo diario de PERUPETRO en GitHub (7:00 a. m.), o con el botón",
      bases: () => ["hidro-produccion", "hidro-canon"], actualizar: "hidro", cuadros: "hidrocarburos", mapa: true,
      lead: "Producción fiscalizada de petróleo, gas natural y LGN por lote, y canon y sobrecanon petrolero transferido." },
    manu: { t: "Sector manufactura", estado: "falta", fuente: "DIREPRO y encuesta BCRP a empresas industriales", entra: "Archivo mensual",
      lead: "Índice de volumen físico de la manufactura.", cuadros: ["Índice de volumen físico", "Anexo de producción manufacturera"] },
    cemento: { t: "Despachos de cemento", estado: "falta", fuente: "Empresas cementeras", entra: "Archivo mensual",
      lead: "Despachos de cemento en la región, indicador adelantado de la construcción.", cuadros: ["Despachos de cemento (t)"] },
    empleo: { t: "Empleo", fuente: "MTPE, Planilla Electrónica (PLAME y T-Registro)", entra: "Scraper del MTPE los días 2 y 21, o subiendo el Excel", bases: () => ["empleo"], actualizar: "empleo",
      lead: "Trabajadores asalariados privados formales por rama de actividad económica.", cuadros: "empleo" },
    expo: { t: "Exportaciones", fuente: "ESTAD de la región (miles de US$)", entra: "Subiendo en la página el ESTAD de la región", bases: () => ["expo-estad"], actualizar: "estad",
      lead: "Exportaciones tradicionales y no tradicionales por grupo de productos (FOB), desde el ESTAD: cuadro de la síntesis, anexo, variación anual y principales productos. En «Base mensual», la base del mes se limpia, se revisa y arma el ESTAD; «Resumen Export» trae los datos destacados y el borrador de la síntesis.", cuadros: "exportaciones", extra: ["Base mensual", "Resumen Export"] },
    impo: { t: "Importaciones", fuente: "ESTAD de Loreto, aduana de Iquitos", entra: "Subiendo en la página el ESTAD de Loreto", bases: () => ["impo-estad"], actualizar: "estad",
      lead: "Importaciones por la aduana de Iquitos según uso o destino económico (FOB), desde el ESTAD de Loreto.", cuadros: "importaciones" },
    credito: { t: "Crédito", estado: "falta", fuente: "SBS", entra: "Scraper de la web de la SBS, por construir",
      lead: "Saldos de crédito del sistema financiero por tipo, sin Banco de la Nación ni Agrobanco, y morosidad.", cuadros: ["Crédito por tipo", "Tasa de morosidad"] },
    depositos: { t: "Depósitos", estado: "falta", fuente: "SBS y AFP", entra: "Scraper de la web de la SBS, por construir",
      lead: "Saldos de depósitos del sistema financiero por tipo.", cuadros: ["Depósitos por tipo"] },
    gasto: { t: "Gasto corriente no financiero", fuente: "MEF, Consulta Amigable", entra: "Scraper del MEF los días 2 y 21, o con el botón", bases: () => GASTO, actualizar: "mef",
      lead: "Gasto corriente no financiero por nivel de gobierno y genérica, mes y acumulado, con variación real y comparación entre años.", cuadros: "ejecucion", extra: ["Contraste", "Archivos"] },
    inversion: { t: "Inversión pública", fuente: "MEF, Consulta Amigable", entra: "Scraper del MEF los días 2 y 21, o con el botón", bases: () => INV, actualizar: "mef",
      lead: "Inversión pública por nivel de gobierno y función, avance del PIM, variaciones alarmantes y los proyectos que las explican.", cuadros: "ejecucion", extra: ["Variaciones alarmantes", "Proyectos", "Contraste", "Archivos"] },
    anexos: { t: "Anexos", fuente: "Todos los sectores", entra: "Se generan solos con los datos de cada sector", bases: (r) => ["gasto-dev-generica", "inv-dev-funcion", "empleo", "hidro-produccion", "expo-estad", r.pesca],
      lead: "Cuadros estadísticos del final del informe, uno por sector, con el formato de la síntesis: listos para copiar o descargar.", cuadros: "anexos" },
  };
  const cap = (titulo, items) => ({ titulo, items });
  const V = "V. Ejecución del presupuesto de gastos del Gobierno General";
  const comunes = [cap("II. Aspectos laborales", ["empleo"]), null, cap("IV. Crédito y depósitos", ["credito", "depositos"]), cap(V, ["gasto", "inversion"])];
  const GRUPOS = {
    lor: { indice: [{ id: "resumen" }, cap("I. Actividad productiva", ["agro", "pesca", "hidro", "manu"]), comunes[0], cap("III. Sector externo", ["expo", "impo"]), comunes[2], comunes[3], { id: "anexos" }] },
    smn: { indice: [{ id: "resumen" }, cap("I. Actividad productiva", ["agro", "pesca", "manu", "cemento"]), comunes[0], cap("III. Sector externo", ["expo"]), comunes[2], comunes[3], { id: "anexos", num: "VI" }] },
    uca: { indice: [{ id: "resumen" }, cap("I. Actividad productiva", ["agro", "pesca", "hidro", "manu"]), comunes[0], cap("III. Sector externo", ["expo"]), comunes[2], comunes[3], { id: "anexos", num: "VI" }] },
    tres: { comun: true, indice: [{ id: "panorama" }, cap("Datos", ["bases-mef", "empleo-long", "bases"]), cap("Actualización", ["act-mef", "act-empleo", "act-hidro", "act-archivos"]), cap("Administración", ["estado", "parametros"])] },
  };
  const C = { panorama: "Panorama de las tres regiones", "bases-mef": "MEF · 25 departamentos", "empleo-long": "Empleo · LONG por región", bases: "Bases comparativas", "act-mef": "Scraper del MEF",
              "act-empleo": "Scraper de empleo", "act-hidro": "Hidrocarburos (PERUPETRO)", "act-archivos": "Subir archivos", estado: "Estado de la base de datos", parametros: "Parámetros" };
  const CORTO = { [V]: "V. Ejecución del presupuesto" };
  const NACIONAL = ["inv-dev-funcion", "inv-dev-municipalidad", "inv-pim-funcion", "inv-pim-municipalidad"];   // bases con los 25 departamentos

  let CAT = null, ESTADO = null, MESES = [], grupo = "lor", id = "resumen";
  const pestana = {}, abiertos = new Set(), paneles = {};
  const base = (b) => CAT.bases.find((x) => x.id === b);
  const planos = (g) => GRUPOS[g].indice.flatMap((e) => e.items ? e.items : [e.id]);
  const nombre = (sid) => GRUPOS[grupo].comun ? C[sid] : S[sid].t;
  function estadoDe(sid, r) {
    const s = S[sid];
    if (!s.bases) return s.estado;
    return s.bases(r).some((b) => ESTADO.bases[b] && ESTADO.bases[b].departamentos.includes(r.cod)) ? "ok" : "vacio";
  }
  const ETIQ = { ok: "Con datos en la página", vacio: "Conectado, sin datos cargados", parcial: "Dato listo, falta conectarlo", falta: "Por construir" };

  // ── Grupos e índice desplegable ──
  function pintarGrupos() {
    const g = { lor: ["Loreto", "LOR"], smn: ["San Martín", "SMN"], uca: ["Ucayali", "UCA"], tres: ["Las tres regiones", "LOR · SMN · UCA"] };
    $("grupos").innerHTML = Object.entries(g).map(([k, [n, c]]) => `<button type="button" data-grupo="${k}" aria-pressed="${k === grupo}">${esc(n)}<small>${esc(c)}</small></button>`).join("");
    document.querySelectorAll("[data-grupo]").forEach((b) => b.addEventListener("click", () => { location.hash = `${b.dataset.grupo}-${planos(b.dataset.grupo)[0]}`; }));
  }
  function pintarIndice() {
    const g = GRUPOS[grupo], r = REG[grupo];
    $("indice-t").textContent = g.comun ? "Común a las tres regiones" : `Índice · ${r.nombre}`;
    $("leyenda").hidden = !!g.comun;
    const dot = (sid) => g.comun ? "" : `<span class="dot ${estadoDe(sid, r)}"></span>`;
    const item = (sid) => `<button class="it" data-ir="${grupo}-${sid}" aria-current="${sid === id ? "page" : "false"}">${esc(nombre(sid))}${dot(sid)}</button>`;
    $("indice").innerHTML = g.indice.map((e, i) => {
      if (!e.items) return `<div class="cap"><button class="it solo" data-ir="${grupo}-${e.id}" aria-current="${e.id === id ? "page" : "false"}"><i>${esc(e.num || "")}</i>${esc(nombre(e.id))}${dot(e.id)}</button></div>`;
      const [rom, ...resto] = (CORTO[e.titulo] || e.titulo).split(". "), num = /^[IVX]+$/.test(rom), clave = `${grupo}:${i}`;
      const abierto = abiertos.has(clave) || e.items.includes(id);
      return `<div class="cap"><button class="cap-b" type="button" data-cap="${clave}" aria-expanded="${abierto}"><i>${num ? rom : ""}</i>${esc(num ? resto.join(". ") : e.titulo)}<span class="flecha"></span></button>
        <div class="cap-items"${abierto ? "" : " hidden"}>${e.items.map(item).join("")}</div></div>`;
    }).join("");
    $("sel-movil").innerHTML = g.indice.flatMap((e) => e.items ? e.items.map((sid) => [sid, e.titulo.split(".")[0] + " · "]) : [[e.id, ""]])
      .map(([sid, p]) => `<option value="${grupo}-${sid}"${sid === id ? " selected" : ""}>${esc(p + nombre(sid))}</option>`).join("");
    document.querySelectorAll("#indice [data-ir]").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.ir; }));
    document.querySelectorAll("#indice [data-cap]").forEach((b) => b.addEventListener("click", () => {
      const abrir = b.getAttribute("aria-expanded") !== "true";
      b.setAttribute("aria-expanded", String(abrir)); b.nextElementSibling.hidden = !abrir;
      abrir ? abiertos.add(b.dataset.cap) : abiertos.delete(b.dataset.cap);
    }));
  }

  // ── Panel de descarga de bases (sector, MEF 25 departamentos, comparativas) ──
  function panelBases(clave, bases, opc) {
    const p = paneles[clave] = paneles[clave] || { marcadas: bases.slice(0, opc.marcar || 2), desde: opc.desde || MESES[Math.max(0, MESES.length - 9)], hasta: MESES[MESES.length - 1], nivel: "todos", formato: "xlsx", hoja: null };
    p.bases = bases; p.deptos = opc.deptos;
    const conNivel = bases.some((b) => base(b).usa_niveles);
    const filas = bases.map((b, i) => { const x = base(b), e = ESTADO.bases[b];
      return `<tr><td><input type="checkbox" id="${clave}-b${i}" data-base="${b}" ${p.marcadas.includes(b) ? "checked" : ""}></td>
        <td><label for="${clave}-b${i}"><b>${esc(x.nombre)}</b></label></td><td>${esc(x.descripcion)}</td>
        ${opc.alcance ? `<td><span class="alcance ${NACIONAL.includes(b) ? "nac" : "reg"}">${NACIONAL.includes(b) ? "los 25" : "LOR · SMN · UCA"}</span></td>` : ""}
        <td>${e.filas ? `${esc(etqMes(e.desde))} – ${esc(etqMes(e.hasta))}` : "sin datos"}</td><td class="n">${fmt(e.filas)}</td></tr>`; }).join("");
    const opMeses = (sel) => MESES.map((m) => `<option value="${m}"${m === sel ? " selected" : ""}>${esc(etqMes(m))}</option>`).join("");
    return `<div class="scroll"><table><tr><th></th><th>Base</th><th>Contenido</th>${opc.alcance ? "<th>Departamentos</th>" : ""}<th>Datos</th><th class="n">Filas</th></tr>${filas}</table></div>
      <div class="fila"><label class="campo" for="${clave}-d">Desde<select id="${clave}-d">${opMeses(p.desde)}</select></label>
        <label class="campo" for="${clave}-h">Hasta<select id="${clave}-h">${opMeses(p.hasta)}</select></label>
        ${conNivel ? `<label class="campo" for="${clave}-n">Nivel de gobierno<select id="${clave}-n">${[["todos", "Los tres"], ["nacional", "Nacional"], ["regional", "Regional"], ["locales", "Locales"]].map(([v, t]) => `<option value="${v}"${v === p.nivel ? " selected" : ""}>${t}</option>`).join("")}</select></label>` : ""}
        <label class="campo" for="${clave}-f">Formato<select id="${clave}-f"><option value="xlsx">Excel (.xlsx)</option><option value="csv"${p.formato === "csv" ? " selected" : ""}>CSV</option></select></label>
        <button class="btn" type="button" id="${clave}-bajar">Descargar</button></div>
      <p class="nota">El Excel trae una hoja por base, con el formato de PIM_Funcion.xlsx. Las bases de PIM toman los años del rango.</p>
      <div id="${clave}-vista"></div>`;
  }
  function consultaPanel(clave) {
    const p = paneles[clave];
    const niveles = p.nivel === "todos" ? "nacional,regional,locales" : p.nivel;
    return new URLSearchParams({ base: p.marcadas.join(","), departamento: p.deptos().join(","), nivel: niveles, desde: p.desde, hasta: p.hasta }).toString();
  }
  function atarPanel(clave) {
    const p = paneles[clave];
    if (!p || !$(`${clave}-d`)) return;
    const cambio = () => {
      p.marcadas = [...document.querySelectorAll(`[id^="${clave}-b"][data-base]`)].filter((c) => c.checked).map((c) => c.dataset.base);
      p.desde = $(`${clave}-d`).value; p.hasta = $(`${clave}-h`).value; p.formato = $(`${clave}-f`).value;
      if ($(`${clave}-n`)) p.nivel = $(`${clave}-n`).value;
      vistaPrevia(clave);
    };
    document.querySelectorAll(`[id^="${clave}-"]`).forEach((el) => { if (el.tagName === "SELECT" || el.type === "checkbox") el.addEventListener("change", cambio); });
    $(`${clave}-bajar`).addEventListener("click", () => {
      if (!p.marcadas.length) { $(`${clave}-vista`).innerHTML = '<div class="err-box"><b>Marca al menos una base</b></div>'; return; }
      window.location.href = `/v1/descargas?${consultaPanel(clave)}&formato=${p.formato}`;
    });
    p.recargar = cambio;
    vistaPrevia(clave);
  }
  let temporizador = null;
  function vistaPrevia(clave) {
    const p = paneles[clave], caja = $(`${clave}-vista`);
    if (!caja) return;
    if (!p.marcadas.length || !p.deptos().length) { caja.innerHTML = `<p class="nota">Marca al menos una base${p.deptos().length ? "" : " y un departamento"} para ver la vista previa.</p>`; return; }
    if (p.desde > p.hasta) { caja.innerHTML = '<div class="err-box"><b>El periodo está al revés</b><span>«Desde» es posterior a «Hasta».</span></div>'; return; }
    clearTimeout(temporizador);
    temporizador = setTimeout(async () => {
      caja.innerHTML = '<div class="loading"><span class="spin"></span>Buscando en la base de datos…</div>';
      try {
        const v = await api(`/v1/descargas/vista-previa?${consultaPanel(clave)}&filas=8`);
        const a = v.archivos.find((x) => x.hoja === p.hoja) || v.archivos[0];
        p.hoja = a.hoja;
        const pesca = base(a.base).grupo === "pesca";
        const filas = a.muestra.length ? a.muestra.map((f) => `<tr>${a.columnas.map((k) => { const x = f[k], num = typeof x === "number";
          return `<td class="${num ? "n" : ""}">${num && k !== "AÑO" && k !== "MES" ? (pesca ? fmt3(x) : fmt(x)) : esc(x)}</td>`; }).join("")}</tr>`).join("")
          : `<tr><td colspan="${a.columnas.length}">No hay filas para estas opciones.</td></tr>`;
        caja.innerHTML = `<div class="fila" style="justify-content:space-between;align-items:center"><b>Vista previa · ${fmt(v.filas_total)} filas en total</b>
            <div class="hojas">${v.archivos.map((x) => `<button type="button" data-hoja="${esc(x.hoja)}" aria-pressed="${x.hoja === a.hoja}">${esc(x.hoja)} · ${fmt(x.filas)}</button>`).join("")}</div></div>
          ${v.avisos.map((x) => `<p class="nota">${esc(x)}</p>`).join("")}
          <div class="scroll"><table><tr>${a.columnas.map((k) => `<th>${esc(k)}</th>`).join("")}</tr>${filas}</table></div>`;
        caja.querySelectorAll("[data-hoja]").forEach((b) => b.addEventListener("click", () => { p.hoja = b.dataset.hoja; vistaPrevia(clave); }));
      } catch (e) { caja.innerHTML = `<div class="err-box"><b>No se pudo armar la vista previa</b><span>${esc(e.message)}</span></div>`; }
    }, 250);
  }

  // ── Empleo en formato LONG (el Excel del scraper) por regiones ──
  const regionesLong = () => $("el-vista") && $("el-vista").dataset.region ? [$("el-vista").dataset.region] : paneles.empReg;
  function consultaEmpleoLong() {
    const q = paneles.empLong;
    return new URLSearchParams({ regiones: regionesLong().join(","), desde: q.desde, hasta: q.hasta }).toString();
  }
  function cajaLong(sufijoRegion) {
    const q = paneles.empLong || (paneles.empLong = { desde: "", hasta: "", formato: "xlsx" });
    const opMeses = (v, vacio) => `<option value="">${vacio}</option>` + MESES.map((m) => `<option value="${m}"${m === v ? " selected" : ""}>${esc(etqMes(m))}</option>`).join("");
    return `<div class="fila">
        <label class="campo" for="el-d">Desde<select id="el-d">${opMeses(q.desde, "Desde el inicio")}</select></label>
        <label class="campo" for="el-h">Hasta<select id="el-h">${opMeses(q.hasta, "Hasta el último mes")}</select></label>
        <label class="campo" for="el-f">Formato<select id="el-f"><option value="xlsx">Excel (.xlsx)</option><option value="csv"${q.formato === "csv" ? " selected" : ""}>CSV</option></select></label>
        <button class="btn" type="button" id="el-bajar">Descargar</button></div>

  // ── Eje de meses con el año debajo (todos los gráficos): «Ene.» … y «2025» en el primer mes y en cada enero ──
  function ejeMeses(etqs, X, H, mostrar, mitad) {   // mitad: media distancia entre meses (la raya del año va entre dos meses)
    const meses = etqs.map((e, i) => mostrar(i) ? `<text x="${X(i)}" y="${H - 22}" text-anchor="middle">${esc(e.split(" ")[0])}</text>` : "").join("");
    const grupos = [];                                   // [año, primer índice, último índice]
    etqs.forEach((e, i) => { const a = e.split(" ")[1]; if (!grupos.length || grupos[grupos.length - 1][0] !== a) grupos.push([a, i, i]); else grupos[grupos.length - 1][2] = i; });
    const anios = grupos.map(([a, i0, i1], k) => `${k ? `<line class="sep" x1="${X(i0) - mitad}" x2="${X(i0) - mitad}" y1="${H - 36}" y2="${H}"></line>` : ""}
      <text class="anio" x="${(X(i0) + X(i1)) / 2}" y="${H - 4}" text-anchor="middle">${esc(a)}</text>`).join("");
    return meses + anios;
  }

  // ── Número de trabajadores (línea, como el portal del MTPE) ──
  function graficoNiveles(n) {
    if (!n || n.length < 2) return "";
    const W = 900, H = 240, izq = 34, der = 34, arr = 34, aba = 48, vals = n.map((x) => x.trabajadores);
    const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.15 || hi * 0.05 || 1;
    const y0 = lo - pad, y1 = hi + pad, X = (i) => izq + i * (W - izq - der) / (n.length - 1), Y = (v) => arr + (y1 - v) / (y1 - y0) * (H - arr - aba);
    const mil = (v) => `${(v / 1000).toLocaleString("es-PE", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} mil`;
    // valores en los meses de cada trimestre (ene., abr., jul., oct.) y el último, sin chocar con este
    const trimestral = (i) => ["Ene.", "Abr.", "Jul.", "Oct."].includes(n[i].periodo.split(" ")[0]);
    const etiqueta = (i) => i === n.length - 1 || (trimestral(i) && i < n.length - 2);
    const linea = n.map((x, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(x.trabajadores).toFixed(1)}`).join(" ");
    const puntos = n.map((x, i) => `<g class="pt"><circle class="hit" cx="${X(i)}" cy="${Y(x.trabajadores)}" r="11"></circle><circle class="dot${etiqueta(i) ? " marcado" : ""}" cx="${X(i)}" cy="${Y(x.trabajadores)}" r="3"></circle>
        ${etiqueta(i) ? `<text class="val" x="${X(i)}" y="${Y(x.trabajadores) - 11}" text-anchor="middle">${mil(x.trabajadores)}</text>` : ""}
        <title>${esc(x.periodo)}: ${fmt(x.trabajadores)} trabajadores</title></g>`).join("");
    const meses = ejeMeses(n.map((x) => x.periodo), X, H, (i) => trimestral(i) || i === n.length - 1, (X(1) - X(0)) / 2);
    return `<div class="caja"><h3>Gráfico · Número de trabajadores</h3><p>(Total de trabajadores asalariados privados formales · ${esc(n[0].periodo)} a ${esc(n[n.length - 1].periodo)})</p>
      <div class="scroll"><svg class="linea-niveles" viewBox="0 0 ${W} ${H}" role="img" aria-label="Número de trabajadores por mes">
        <line class="eje" x1="0" x2="${W}" y1="${H - aba}" y2="${H - aba}"></line><path class="area" d="${linea} L${X(n.length - 1)},${H - aba} L${X(0)},${H - aba} Z"></path><path class="trazo" d="${linea}"></path>${puntos}${meses}</svg></div></div>`;
  }

  // ── Cuadros de empleo (los de la síntesis) ──

      const g = c.grafico.filter((x) => x.var != null), max = Math.max(1, ...g.map((x) => Math.abs(x.var))), W = 760, H = 250, bw = W / Math.max(g.length, 1);

  // ── Cuadros de hidrocarburos (los de la síntesis) ──

      const gr = c.grafico, g = gr ? gr.serie : [], max = Math.max(0.001, ...g.map((x) => x.valor)), W = 760, H = 245, base0 = 195, bw = W / Math.max(g.length, 1);

          <text class="val" x="${i * bw + bw / 2}" y="${base0 - h - 4}" text-anchor="middle">${fmt1(x.valor)}${x.parcial ? "*" : ""}</text>`; }).join("") + ejeMeses(g.map((x) => x.periodo), (i) => i * bw + bw / 2, H, () => true, bw / 2);

  // ── Ejecución del presupuesto: gasto corriente no financiero e inversión pública ──
  const mill = (v) => v == null ? "" : v.toLocaleString("es-PE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const delta = (v) => v == null ? '<span class="delta">n.d.</span>' : `<span class="delta ${v >= 0 ? "sube" : "baja"}">${v >= 0 ? "▲" : "▼"} ${pct(Math.abs(v))} %</span>`;
  const estadoEjec = (clave) => paneles[clave] || (paneles[clave] = { periodo: "", comparar: "", vista: "mes" });
  function selectorEjec(c, clave, extra) {

  // barras agrupadas: dos años mes a mes (millones de soles)
  function barrasAnios(m, a, b) {
    const W = 760, H = 250, base0 = 196, izq = 6, bw = (W - izq) / 12, vals = [...m.a, ...m.b].filter((x) => x != null), max = Math.max(0.001, ...vals);

      ${k ? `<text class="val" x="${izq + i * bw + bw * 0.69}" y="${base0 - v / max * 160 - 4}" text-anchor="middle">${mill(v)}</text>` : ""}`;
    const etiquetas = m.meses.map((x, i) => `<text x="${izq + i * bw + bw / 2}" y="${H - 30}" text-anchor="middle">${esc(x)}</text>`).join("");
    return `<svg class="barras" viewBox="0 0 ${W} ${H - 18}" role="img" aria-label="Mes a mes, ${a} contra ${b}"><line class="eje" x1="0" x2="${W}" y1="${base0}" y2="${base0}"></line>
      ${m.b.map((v, i) => barra(v, i, 0)).join("")}${m.a.map((v, i) => barra(v, i, 1)).join("")}${etiquetas}</svg>`;
  }
  // líneas (un eje): series [{nombre, clase, valores[12]}]
  function lineas(series, meses, sufijo, H = 230) {
    const W = 760, izq = 40, der = 16, arr = 16, aba = 34, vals = series.flatMap((s) => s.valores).filter((x) => x != null), max = Math.max(1e-9, ...vals);
    const X = (i) => izq + i * (W - izq - der) / (meses.length - 1), Y = (v) => arr + (1 - v / max) * (H - arr - aba);
    const rejilla = [0, 0.5, 1].map((f) => `<line class="rejilla" x1="${izq}" x2="${W - der}" y1="${Y(max * f)}" y2="${Y(max * f)}"></line><text class="eje-y" x="${izq - 6}" y="${Y(max * f) + 4}" text-anchor="end">${mill(max * f)}</text>`).join("");
    const trazos = series.map((s) => {
      const pts = s.valores.map((v, i) => v == null ? null : [X(i), Y(v), v]).filter(Boolean);
      if (!pts.length) return "";
      const ult = pts[pts.length - 1];
      return `<path class="trazo ${s.clase}" d="${pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")}"></path>
        ${pts.map((p, i) => `<circle class="pto ${s.clase}" cx="${p[0]}" cy="${p[1]}" r="3"><title>${esc(meses[s.valores.indexOf(p[2]) >= 0 ? i : i])} · ${esc(s.nombre)}: ${mill(p[2])}${sufijo}</title></circle>`).join("")}
        <text class="val" x="${ult[0] + 4}" y="${ult[1] - 8}" text-anchor="end">${mill(ult[2])}${sufijo}</text>`;
    }).join("");
    return `<svg class="lineas" viewBox="0 0 ${W} ${H}" role="img">${rejilla}${trazos}${meses.map((m, i) => `<text x="${X(i)}" y="${H - 12}" text-anchor="middle">${esc(m)}</text>`).join("")}</svg>`;
  }
  const leyenda = (items) => `<div class="ley-graf">${items.map(([cl, t]) => `<span><i class="${cl}"></i>${esc(t)}</span>`).join("")}</div>`;
  const avanceBarra = (v, ref) => v == null ? "" : `<div class="avance"><div class="pista"><div style="width:${Math.min(v, 100)}%"></div>${ref != null ? `<b style="left:${Math.min(ref, 100)}%" title="Ritmo parejo: ${pct(ref)} %"></b>` : ""}</div><span>${pct(v)} %</span></div>`;

  // barras de variación % (positivas y negativas) con el año debajo de los meses
  function barrasVar(g, W) {
    if (!g.length) return '<p class="nota">Hace falta el mismo mes del año anterior para la variación.</p>';
    const max = Math.max(1, ...g.map((x) => Math.abs(x.var))), H = 230, y0 = 100, bw = W / g.length;
    return `<svg class="barras" viewBox="0 0 ${W} ${H}"><line class="eje" x1="0" x2="${W}" y1="${y0}" y2="${y0}"></line>${g.map((x, i) => { const h = Math.abs(x.var) / max * 80, y = x.var >= 0 ? y0 - h : y0;
      return `<rect class="${x.var >= 0 ? "pos" : "neg"}" x="${i * bw + bw * 0.18}" y="${y}" width="${bw * 0.64}" height="${Math.max(h, 1)}" rx="2"><title>${esc(x.periodo)}: ${pct(x.var)} %</title></rect><text class="val" x="${i * bw + bw / 2}" y="${x.var >= 0 ? y - 4 : y + h + 11}" text-anchor="middle">${pct(x.var)}</text>`; }).join("")}
      ${ejeMeses(g.map((x) => x.periodo), (i) => i * bw + bw / 2, H, () => true, bw / 2)}</svg>`;
  }

  // ── Resumen Export: datos destacados de la base mensual: productos, destinos, aduanas y empresas, y el borrador de sus párrafos ──
  async function resumenSunat(r, caja) {
    const clave = `rs-${grupo}`, st = estadoEjec(clave), mil = (v) => B.num(v, 0), p1 = (v) => v == null ? "" : B.num(v, 1);
    caja.innerHTML = '<div class="loading"><span class="spin"></span>Armando el resumen…</div>';
    try {
      const x = (await api(`/v1/exportaciones/resumen?${new URLSearchParams({ departamento: r.cod, periodo: st.periodo })}`)).resumen;
      if (!x) { caja.innerHTML = `<div class="vacio-caja"><b>Todavía no hay base mensual de exportaciones de ${esc(r.nombre)}.</b><span>Súbela en la pestaña «Base mensual».</span></div>`; return; }
      const mes = x.nombre_mes.charAt(0).toUpperCase() + x.nombre_mes.slice(1), am = `Enero-${x.nombre_mes}`;
      const tabla = (t, lista, col) => `<div class="caja"><h3>${esc(t)}</h3><div class="scroll"><table><tr><th>${esc(col)}</th><th class="n">Miles de US$</th><th class="n">%</th><th>Principales productos</th></tr>
        ${lista.length ? lista.map((e) => `<tr><td>${esc(e.nombre)}</td><td class="n">${mil(e.fob)}</td><td class="n">${p1(e.pct)}</td><td>${esc(e.productos.join(", "))}</td></tr>`).join("") : '<tr><td colspan="4" class="nota">Sin exportaciones.</td></tr>'}</table></div></div>`;
      const bloque = (k, titulo, col) => `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))">${tabla(`${titulo} · ${mes} ${x.anio}`, x["mes"][k], col)}${tabla(`${titulo} · ${am} ${x.anio}`, x.acumulado[k], col)}</div>`;
      const tile = (t, d) => `<div class="stat"><small>${esc(t)}</small><b>US$ ${B.num(d.total / 1000, 2)} mill.</b>${d.var == null ? "" : delta(d.var)}<span>${d.anterior == null ? "sin el mismo periodo del año anterior en la base" : `${x.anio - 1}: ${B.num(d.anterior / 1000, 2)}`}</span></div>`;
      caja.innerHTML = `<div class="fila controles"><label class="campo" for="${clave}-p">Mes<select id="${clave}-p">${[...x.meses].reverse().map((m) => `<option value="${m}"${m === x.periodo ? " selected" : ""}>${esc(etqMes(m))}</option>`).join("")}</select></label>
          <span class="nota">Solo las filas ok de la base mensual (las que entran a los cuadros).</span></div>
        <div class="stats tiles">${tile(`Exportaciones · ${mes} ${x.anio}`, x.mes)}${tile(`${am} ${x.anio}`, x.acumulado)}</div>
        ${x.destacados.length ? `<div class="destacados">${x.destacados.map((d) => `<div class="destacado"><small>${esc(d.titulo)}</small><b>${esc(d.valor)}</b><span>${esc(d.detalle)}</span></div>`).join("")}</div>` : ""}
        <div class="caja"><div class="fila" style="justify-content:space-between;align-items:center"><h3>Borrador para la síntesis</h3><button class="btn" type="button" id="${clave}-cop">Copiar texto</button></div>
          ${x.textos.map((t) => `<p class="parrafo">${esc(t)}</p>`).join("")}<p class="nota" id="${clave}-msj">Revísalo antes de pegarlo: nombra los dos productos con más valor de cada destino y aduana.</p></div>
        ${bloque("productos", "Principales productos", "Producto")}${bloque("destinos", "Mercados de destino", "País")}${bloque("continentes", "Por continente", "Continente")}
        ${bloque("aduanas", "Aduanas", "Aduana")}${bloque("empresas", "Empresas exportadoras", "Empresa")}`;
      $(`${clave}-p`).addEventListener("change", (ev) => { st.periodo = ev.target.value; resumenSunat(r, caja); });

  async function variacionesAlarmantes(r, caja) {
    const clave = `va-${grupo}`, st = estadoEjec(clave);
    caja.innerHTML = '<div class="loading"><span class="spin"></span>Buscando las variaciones…</div>';
    try {
      const v = (await api(`/v1/variaciones?${new URLSearchParams({ departamento: r.cod, periodo: st.periodo, comparar: st.comparar })}`)).variaciones;
      if (!v) { caja.innerHTML = '<div class="vacio-caja"><b>Todavía no hay inversión del MEF cargada.</b></div>'; return; }
      const anios = [...new Set(MESES.map((m) => +m.slice(0, 4)))].filter((x) => x < v.anio && x >= v.anio - 5);
      const comp = v.comparaciones.find((x) => x.clave === st.vista) || v.comparaciones[0];
      const lista = (items, signo, max) => items.length ? items.map((f, i) => `<tr><td class="n">${i + 1}</td><td>${esc(f.item)}</td><td class="n">${mill(f.antes)}</td><td class="n">${mill(f.ahora)}</td>
          <td class="dif"><div class="difbar ${f.dif >= 0 ? "sube" : "baja"}"><i style="width:${Math.abs(f.dif) / max * 100}%"></i><span>${f.dif >= 0 ? "+" : ""}${mill(f.dif)}</span></div></td><td class="n">${pct(f.var)}</td></tr>`).join("")
        : `<tr><td></td><td colspan="5" class="nota">Ningún ítem en la lista de ${signo}.</td></tr>`;
      const bloques = comp.bloques.map((bl) => {
        if (bl.sin_datos) return `<div class="caja"><h3>${esc(bl.nombre)}</h3><p class="nota">Sin datos para comparar${bl.falta && bl.falta.length ? ` (falta ${esc(bl.falta.join(", "))})` : ""}.</p></div>`;
        const max = Math.max(1e-9, ...[...bl.aumentos, ...bl.caidas].map((f) => Math.abs(f.dif))), t = bl.total;
        return `<div class="caja var-bloque"><div class="fila" style="justify-content:space-between;align-items:baseline"><h3>${esc(bl.nombre)}</h3>
            <div class="var-total"><span>Total: S/ ${mill(t.antes)} → ${mill(t.ahora)} mill.</span><b class="${t.dif >= 0 ? "sube" : "baja"}">${t.dif >= 0 ? "+" : ""}${mill(t.dif)} mill. (${pct(t.var)} %)</b></div></div>
          <div class="scroll"><table><tr><th class="n">#</th><th>Ítem</th><th class="n">Antes</th><th class="n">Ahora</th><th>Diferencia (millones S/)</th><th class="n">Var. %</th></tr>
            <tr class="grupo"><td colspan="6"><b class="sube">▲ Mayores aumentos</b></td></tr>${lista(bl.aumentos, "aumentos", max)}
            <tr class="grupo"><td colspan="6"><b class="baja">▼ Mayores caídas</b></td></tr>${lista(bl.caidas, "caídas", max)}</table></div>
          ${bl.pocos ? '<p class="nota">No hay más ítems con inversión en estos periodos.</p>' : ""}</div>`;
      }).join("");
      caja.innerHTML = `<div class="fila controles">
          <div class="segmento">${v.comparaciones.map((x) => `<button type="button" data-vista="${x.clave}" aria-pressed="${x.clave === comp.clave}">${x.clave === "mes" ? "Mes" : "Acumulado"}</button>`).join("")}</div>
          <label class="campo" for="${clave}-c">Comparar con<select id="${clave}-c">${anios.reverse().map((x) => `<option value="${x}"${x === v.comparar ? " selected" : ""}>${x}</option>`).join("")}</select></label></div>
        <p class="lead">${esc(comp.titulo)} · inversión (genérica 2.6) en millones de soles corrientes. Ordenado por la diferencia en soles, no por %; la Var. % es referencial.</p>${bloques}`;
      caja.querySelectorAll("[data-vista]").forEach((bt) => bt.addEventListener("click", () => { st.vista = bt.dataset.vista; variacionesAlarmantes(r, caja); }));
      $(`${clave}-c`).addEventListener("change", (ev) => { st.comparar = ev.target.value; variacionesAlarmantes(r, caja); });
    } catch (e) { caja.innerHTML = `<div class="err-box"><b>No se pudieron calcular las variaciones</b><span>${esc(e.message)}</span></div>`; }
  }

  async function proyectosVariaciones(r, caja) {
    caja.innerHTML = '<div class="loading"><span class="spin"></span>Buscando los proyectos…</div>';

        return { c: [nuevo ? yy : "", mm.toUpperCase(), ...sect.map((k) => f[k] == null ? "n.d." : n1(f[k]))], sep: nuevo && f !== c.anexo[0] }; }),
      notas: ["Fuente: MTPE – Planilla electrónica - PLAME y T-registro."] }); } });
    return items;
  }

  function itemsEjecucion(sector, c, R, N, ultimo) {
    const inv = sector === "inversion", a = c.anio, b = c.comparar, mes = c.titulo_mes, items = [], real = c.real, vtxt = real ? "Var. % real" : "Var. % nominal";
    const nombreNivel = { "Gobierno Nacional": "Gobierno Nacional", "Gobiernos Regionales": "Gobierno Regional", "Gobiernos Locales": "Gobiernos Locales", Total: "Total" };
    const vm = (f) => real ? f.var_mes : f.var_mes_nominal, va = (f) => real ? f.var_acum : f.var_acum_nominal;
    const titulo = inv ? "INVERSIÓN PÚBLICA" : "GASTO CORRIENTE NO FINANCIERO", act = `1/ Información actualizada a ${etqMes(ultimo).toLowerCase()}.`;
    items.push({ clave: "c", tipo: "CUADRO", num: N.c, nombre: `${R}: ${titulo}`, svg: (n) => B.cuadro({ numero: n, titulo: `${R}: ${titulo}`, llamada: inv ? "1/ 2/" : "1/", unidad: "(Millones de soles)",
      cab: [[{ t: "" }, { t: mes, span: 3, linea: true }, { t: `Enero - ${mes}`, span: 3, linea: true }], [{ t: "" }, { t: b }, { t: a }, { t: vtxt }, { t: b }, { t: a }, { t: vtxt }]],
      filas: c.niveles.map((f) => ({ c: [nombreNivel[f.nombre] || f.nombre, n1(f.mes_b), n1(f.mes_a), v1(vm(f)), n1(f.acum_b), n1(f.acum_a), v1(va(f))], b: f.nombre === "Total", total: f.nombre === "Total" })),
      notas: [act, ...(inv ? ["2/ Comprende la adquisición de activos no financieros."] : []), ...(real ? [] : ["Variación nominal: falta el IPC de Lima del mes."]), "Fuente: MEF."] }) });
    const g = c.interanual.map((x) => ({ periodo: x.periodo, valor: real ? x.var : x.var_nominal })).filter((x) => x.valor != null);
    if (g.length) items.push({ clave: "g", tipo: "GRÁFICO", num: N.g, nombre: `${R}: ${titulo} (variación)`, svg: (n) => B.barras({ numero: n, titulo: `${R}: ${titulo}`,
      unidad: `(Variación porcentual ${real ? "real " : ""}respecto a similar periodo del año anterior)`, puntos: g, notas: ["Fuente: MEF."] }) });
    (c.anexos || []).forEach((ax, k) => {
      const t = inv ? `${R}: INVERSIÓN NO FINANCIERA ${ax.nivel}` : `${R}: EJECUCIÓN DEL PRESUPUESTO DE GASTOS ${ax.nivel}`;
      items.push({ clave: `a${k}`, tipo: "ANEXO", num: (N.a || [])[k], nombre: t, svg: (n) => B.anexo({ numero: n, titulo: t, llamada: "1/", unidad: "(Millones de soles)", rotulo: inv ? "FUNCIONES" : "",
        columnas: ax.columnas.map((x) => ({ etq: x.etq, anio: x.anio, total: x.anio === "Total" })), dec: 1, filas: ax.filas, notas: [act, "Fuente: Consulta Amigable - MEF."] }) });
    });
    return items;
  }

  // exportaciones: el cuadro de la síntesis (Cuadro N° 7/5/8), el anexo y los gráficos de las SERIES (ENLACE ESTAD)
  function itemsExpo(c, R, N) {
    const a = c.anio, b = c.comparar, mes = c.titulo_mes, items = [], d = c.dec, expo = c.flujo === "expo", nd = (v) => B.num(v, d);
    const tit = expo ? `${R}: EXPORTACIONES POR GRUPO DE PRODUCTOS` : `${R}: IMPORTACIONES FOB SEGÚN USO O DESTINO ECONÓMICO - ADUANA DE IQUITOS`;
    const corte = `1/ Cifras preliminares y depuradas a ${etqMes(c.ultimo).toLowerCase()}.`;
    items.push({ clave: "c", tipo: "CUADRO", num: N.c, nombre: tit, svg: (n) => B.cuadro({ numero: n, titulo: tit, llamada: "1/", unidad: "(Valor FOB en millones de USD)",
      cab: [[{ t: "TIPO" }, { t: "Estructura %" }, { t: mes, span: 3, linea: true }, { t: `Enero-${mes}`, span: 3, linea: true }], [{ t: "" }, { t: b }, { t: b }, { t: a }, { t: "Var. %" }, { t: b }, { t: a }, { t: "Var. %" }]],
      filas: c.sintesis.map((f) => ({ c: [f.nivel === 0 && f.nombre.startsWith("OTRAS") ? `${f.nombre} 2/` : f.nombre, n1(f.estructura), nd(f.mes_b), nd(f.mes_a), v1(f.var_mes), nd(f.acum_b), nd(f.acum_a), v1(f.var_acum)],
        b: f.nivel === 0, ind: f.nivel, sep: f.nivel === 0 && !f.total, total: f.total })),
      notas: [corte, ...(expo ? ["2/ Incluye reparación de bienes de capital, manufacturas de plástico, partes de aeronaves, entre otros."] : []), "Fuente: SUNAT."] }) });
    const pie = (c.notas_estad || []).filter((x) => /^[23]\//.test(x));
    items.push({ clave: "a0", tipo: "ANEXO", num: (N.a || [])[0], nombre: tit, svg: (n) => B.anexo({ numero: n, titulo: tit, llamada: "1/", unidad: "(Valor FOB - Millones de USD)",
      columnas: c.anexo.columnas, dec: 1, filas: c.anexo.filas, notas: ["1/ Cifras preliminares.", ...(expo ? pie : []), "Fuente: SUNAT."] }) });
    if (!expo) return items;
    const va = c.variacion_anual.filter((x) => x.var != null), m3 = mes.slice(0, 3).toLowerCase();
    if (va.length) items.push({ clave: "g1", tipo: "GRÁFICO", num: N.g, nombre: `${R}: VARIACIÓN DE LAS EXPORTACIONES`, svg: (n) => B.barras({ numero: n, titulo: `${R}: EXPORTACIONES`,
      unidad: grupo === "uca" ? `(Variación % enero-${mes.toLowerCase()} respecto a similar periodo del año anterior)` : "(Variación % respecto al año anterior)", dec: 1, tope: grupo === "lor" ? 250 : null, sinEje: true,
      puntos: va.map((x) => ({ etq: x.etq, valor: x.var })), notas: [...(grupo === "uca" ? [] : [`* Enero-${mes.toLowerCase()}.`]), "Fuente: SUNAT."] }) });
    const nt = c.no_tradicionales, mm = (p) => p.map((x) => ({ nombre: x.nombre, valor: x.valor }));
    if (nt && (nt.anterior.partes.length || nt.actual.partes.length)) items.push({ clave: "g2", tipo: "GRÁFICO", num: N.g2, nombre: `${R}: PRINCIPALES PRODUCTOS NO TRADICIONALES`, svg: (n) => B.circulares({ numero: n,
      titulo: `${R}: PRINCIPALES PRODUCTOS NO TRADICIONALES EXPORTADOS`, unidad: "(Estructura % del valor FOB)",
      circulos: [{ subtitulo: `Enero-diciembre ${b}`, partes: mm(nt.anterior.partes) }, { subtitulo: `Enero-${mes.toLowerCase()} ${a}`, partes: mm(nt.actual.partes) }], notas: ["Fuente: SUNAT."] }) });
    const pr = c.principales, mil = (p) => p.map((x) => ({ nombre: x.nombre, valor: x.valor / 1000 }));
    if (pr.acumulado.partes.length) items.push({ clave: "g3", tipo: "GRÁFICO", num: N.g3, nombre: `${R}: PRINCIPALES PRODUCTOS EXPORTADOS, ENERO-${mes.toUpperCase()}`, svg: (n) => B.hbarras({ numero: n,
      titulo: `${R}: PRINCIPALES PRODUCTOS EXPORTADOS, ENERO-${mes.toUpperCase()} ${a}`, unidad: "(Valor FOB en millones de USD)", dec: d, partes: mil(pr.acumulado.partes), notas: ["Fuente: SUNAT."] }) });
    if (pr.mes.partes.length) items.push({ clave: "g4", tipo: "GRÁFICO", num: N.g4, nombre: `${R}: PRINCIPALES PRODUCTOS EXPORTADOS, ${mes.toUpperCase()}`, svg: (n) => B.hbarras({ numero: n,
      titulo: `${R}: PRINCIPALES PRODUCTOS EXPORTADOS, ${mes.toUpperCase()} ${a}`, unidad: "(Valor FOB en millones de USD)", dec: d, partes: mil(pr.mes.partes), notas: ["Fuente: SUNAT."] }) });
    return items;
  }

  const URL_BCRP = (sid, r, periodo) => {
    const qp = periodo ? `&periodo=${periodo}` : "";
    return { pesca: `/v1/cuadros/pesca?departamento=${r.cod}${qp}`, hidro: `/v1/cuadros/hidrocarburos?departamento=${r.cod}${qp}`, empleo: `/v1/cuadros/empleo?departamento=${r.cod}${qp}`,
      gasto: `/v1/cuadros/ejecucion?departamento=${r.cod}&sector=gasto&anexos=true${qp}`, inversion: `/v1/cuadros/ejecucion?departamento=${r.cod}&sector=inversion&anexos=true${qp}`,
      expo: `/v1/cuadros/exportaciones?departamento=${r.cod}${qp}`, impo: `/v1/cuadros/exportaciones?departamento=${r.cod}&flujo=impo${qp}` }[sid];
  };
  const itemsBCRP = (sid, c, R, N) => sid === "expo" || sid === "impo" ? itemsExpo(c, R, N) : sid === "pesca" ? itemsPesca(c, R, N) : sid === "hidro" ? itemsHidro(c, R, N) : sid === "empleo" ? itemsEmpleo(c, R, N) : itemsEjecucion(sid, c, R, N, c.ultimo);

  // galería: cada cuadro con su número (editable), Copiar / SVG / PNG; un ítem sin svg es un pendiente (texto)
  function galeriaBCRP(caja, clave, items, controles) {
    const etiqueta = (it, n) => n === "" || n == null ? (it.tipo === "ANEXO" ? "ANEXO" : `${it.tipo} N°`) : it.tipo === "ANEXO" ? `ANEXO ${n}` : `${it.tipo} N° ${n}`;
    const valorNum = (it) => numBcrp[`${clave}-${it.clave}`] ?? (it.num ?? "");
    const listos = items.map((it, k) => [it, k]).filter(([it]) => it.svg);
    caja.innerHTML = `<div class="fila controles">${controles}<button class="btn sec" type="button" id="${clave}-todo"${listos.length ? "" : " disabled"}>Descargar todos (SVG)</button></div>
      <p class="lead">Con el formato de la síntesis. <b>Copiar</b> deja la imagen lista para pegar en Word (Ctrl+V); <b>SVG</b> es vectorial (en Word: Insertar → Imágenes) y no pierde nitidez al ampliarla; <b>Excel</b> lo baja con el mismo formato. Cambia el número si el informe lo pide.</p>
      ${items.map((it, k) => it.svg ? `<div class="caja bcrp-item"><div class="fila" style="justify-content:space-between;align-items:center">
          <label class="campo bcrp-num">${esc(it.tipo === "ANEXO" ? "Anexo" : it.tipo === "CUADRO" ? "Cuadro N°" : "Gráfico N°")}<input type="text" inputmode="numeric" data-k="${k}" value="${esc(valorNum(it))}" size="3"></label>
          <div class="fila"><button class="btn" type="button" data-copiar="${k}">Copiar</button><button class="btn sec" type="button" data-svg="${k}">SVG</button><button class="btn sec" type="button" data-png="${k}">PNG</button><button class="btn sec" type="button" data-xlsx="${k}">Excel</button></div></div>
        <div class="bcrp-prev" id="${clave}-v${k}"></div><div class="bcrp-msj" id="${clave}-m${k}" aria-live="polite"></div></div>`
        : `<div class="vacio-caja bcrp-pendiente"><b>${esc(etiqueta(it, it.num))} · ${esc(it.nombre)}</b><span>${esc(it.pendiente)}</span></div>`).join("")}`;
    const svgDe = (k) => items[k].svg(etiqueta(items[k], valorNum(items[k])));
    const pintar = (k) => { $(`${clave}-v${k}`).innerHTML = svgDe(k); };
    listos.forEach(([, k]) => pintar(k));
    const avisar = (k, t, ok) => { const m = $(`${clave}-m${k}`); m.textContent = t; m.className = `bcrp-msj ${ok ? "ok" : "mal"}`; setTimeout(() => { m.textContent = ""; }, 3500); };
    caja.querySelectorAll(".bcrp-num input").forEach((inp) => inp.addEventListener("input", () => { const k = +inp.dataset.k; numBcrp[`${clave}-${items[k].clave}`] = inp.value.trim(); pintar(k); }));
    caja.querySelectorAll("[data-copiar]").forEach((bt) => bt.addEventListener("click", async () => { const k = +bt.dataset.copiar;
      try { await B.copiar(svgDe(k)); avisar(k, "Copiado: pégalo en Word con Ctrl+V.", true); } catch (e) { avisar(k, e.message, false); } }));
    const nombreDe = (k) => `${etiqueta(items[k], valorNum(items[k]))} ${items[k].nombre}`;
    caja.querySelectorAll("[data-svg]").forEach((bt) => bt.addEventListener("click", () => { const k = +bt.dataset.svg; B.descargar(svgDe(k), nombreDe(k)); }));
    caja.querySelectorAll("[data-png]").forEach((bt) => bt.addEventListener("click", async () => { const k = +bt.dataset.png; try { await B.descargarPng(svgDe(k), nombreDe(k)); } catch (e) { avisar(k, e.message, false); } }));
    caja.querySelectorAll("[data-xlsx]").forEach((bt) => bt.addEventListener("click", async () => { const k = +bt.dataset.xlsx;
      try { svgDe(k); await B.excel(B.ultimo, nombreDe(k)); } catch (e) { avisar(k, e.message, false); } }));
    $(`${clave}-todo`).addEventListener("click", async () => { for (const [, k] of listos) { B.descargar(svgDe(k), nombreDe(k)); await new Promise((ok) => setTimeout(ok, 350)); } });
  }
  const selectorMes = (clave, meses, actual) => `<label class="campo" for="${clave}-p">Mes del informe<select id="${clave}-p">${meses.map((m) => `<option value="${m}"${m === actual ? " selected" : ""}>${esc(etqMes(m))}</option>`).join("")}</select></label>`;

  async function cuadrosBCRP(sid, r, caja) {
    const clave = `bcrp-${sid}-${grupo}`, st = estadoEjec(clave), R = r.nombre.toUpperCase(), N = (NUM_BCRP[grupo] || {})[sid] || {};
    caja.innerHTML = '<div class="loading"><span class="spin"></span>Armando los cuadros y gráficos…</div>';
    try {
      const c = (await api(URL_BCRP(sid, r, st.periodo))).cuadros;
      if (!c) { caja.innerHTML = `<div class="vacio-caja"><b>Todavía no hay datos de ${esc(S[sid].t.toLowerCase())} de ${esc(r.nombre)}.</b><span>Cárgalos en la pestaña «Actualizar».</span></div>`; return; }
      const ultimo = c.ultimo || c.periodo, desde = (ESTADO.bases[(S[sid].bases(r) || [])[0]] || {}).desde || "";
      galeriaBCRP(caja, clave, itemsBCRP(sid, c, R, N), selectorMes(clave, MESES.filter((m) => m >= desde && m <= ultimo).reverse(), c.periodo));
      $(`${clave}-p`).addEventListener("change", (ev) => { st.periodo = ev.target.value; cuadrosBCRP(sid, r, caja); });
    } catch (e) { caja.innerHTML = `<div class="err-box"><b>No se pudieron armar los cuadros</b><span>${esc(e.message)}</span></div>`; }
  }

  // ── Anexos: los de la síntesis de cada región, en su orden (junio 2026). [sector, n° de anexo del sector] o [sector, título] si aún no hay datos
  const ANEXOS_TAB = "Anexos BCRP";
  const PENDIENTES = { agro: "Producción agrícola (MIDAGRI / dirección regional de agricultura)", manu1: "Producción manufacturera · índice de volumen físico (año 2007 = 100)",
    manu2: "Producción manufacturera · variación porcentual", expo: "Exportaciones por grupo de productos", impo: "Importaciones FOB según uso o destino económico - Aduana de Iquitos",
    credito: "Crédito (SBS)", depositos: "Depósitos (SBS)", morosidad: "Tasa de morosidad (SBS)" };
  const ANEXOS_SINTESIS = {
    lor: [["agro"], ["hidro", 0], ["manu1"], ["manu2"], ["empleo", 0], ["expo", 0], ["impo", 0], ["gasto", 0], ["gasto", 1], ["gasto", 2], ["inversion", 0], ["inversion", 1], ["inversion", 2], ["credito"], ["depositos"], ["morosidad"]],
    smn: [["agro"], ["manu1"], ["manu2"], ["expo", 0], ["gasto", 0], ["gasto", 1], ["gasto", 2], ["inversion", 0], ["inversion", 1], ["inversion", 2], ["credito"], ["depositos"], ["morosidad"]],
    uca: [["agro"], ["pesca", 0], ["hidro", 0], ["manu1"], ["manu2"], ["expo", 0], ["gasto", 0], ["gasto", 1], ["gasto", 2], ["inversion", 0], ["inversion", 1], ["inversion", 2], ["credito"], ["depositos"], ["morosidad"]],
  };
  async function anexosBCRP(r, caja) {
    const clave = `anx-${grupo}`, st = estadoEjec(clave), R = r.nombre.toUpperCase(), lista = ANEXOS_SINTESIS[grupo] || [];
    caja.innerHTML = '<div class="loading"><span class="spin"></span>Armando los anexos…</div>';
    const sectores = [...new Set(lista.filter((x) => x.length === 2).map((x) => x[0]))];
    const datos = Object.fromEntries(await Promise.all(sectores.map(async (sid) => {
      try { return [sid, { c: (await api(URL_BCRP(sid, r, st.periodo))).cuadros }]; } catch (e) { return [sid, { error: e.message }]; }
    })));
    const anexosDe = {};
    sectores.forEach((sid) => { const d = datos[sid]; if (d.c) anexosDe[sid] = itemsBCRP(sid, d.c, R, {}).filter((it) => it.tipo === "ANEXO"); });
    const items = lista.map(([sid, k], i) => {
      const num = i + 1;
      if (k === undefined) return { clave: `p${num}`, tipo: "ANEXO", num, nombre: PENDIENTES[sid], pendiente: "Todavía no entra a la página: se armará cuando se construya este sector." };
      const it = (anexosDe[sid] || [])[k];
      if (it) return { ...it, clave: `${sid}-${k}`, num };
      const d = datos[sid] || {};
      return { clave: `x${num}`, tipo: "ANEXO", num, nombre: `${S[sid].t}${sid === "gasto" || sid === "inversion" ? ` · ${["Gobierno Nacional", "Gobierno Regional", "Gobiernos Locales"][k]}` : ""}`,
        pendiente: d.error ? `No se pudo armar: ${d.error}` : `Todavía no hay datos de ${S[sid].t.toLowerCase()} de ${r.nombre}: cárgalos en ese sector («Actualizar»).` };
    });
    // meses: los del MEF (la mayoría de los anexos); cada sector usa el elegido si lo tiene
    const ult = sectores.map((sid) => datos[sid].c && (datos[sid].c.ultimo || datos[sid].c.periodo)).filter(Boolean).sort().pop() || MESES[MESES.length - 1];
    const actual = st.periodo || ult, meses = MESES.filter((m) => m >= "2025-01" && m <= ult).reverse();
    const listos = items.filter((it) => it.svg).length;
    galeriaBCRP(caja, clave, items, `${selectorMes(clave, meses, actual)}<span class="nota">${listos} de ${items.length} anexos con datos</span>`);
    $(`${clave}-p`).addEventListener("change", (ev) => { st.periodo = ev.target.value; anexosBCRP(r, caja); });
  }

  // ── Contraste: lo que tiene la página contra lo publicado por el MEF (vista anual de Consulta Amigable, de los CSV de CONTROL del scraper) ──
  async function contrasteMEF(sector, r, caja) {
    caja.innerHTML = '<div class="loading"><span class="spin"></span>Comparando con lo publicado por el MEF…</div>';
    try {
      const x = (await api(`/v1/contraste/ejecucion?departamento=${r.cod}&sector=${sector}`)).contraste;
      const chip = { coincide: '<span class="chip ok">coincide</span>', "mes en curso": '<span class="chip vacio">mes en curso</span>', revisar: '<span class="chip error">revisar</span>' };
      const sol = (v) => v == null ? "" : Math.round(v).toLocaleString("es-PE");
      const bloques = [...new Set(x.map((f) => f.bloque))];
      caja.innerHTML = `<p class="lead">En cada corrida, el scraper del MEF consulta también la <b>vista anual de Consulta Amigable</b> (lo que publica el MEF para todo el año) y la guarda en sus CSV de CONTROL.
          Aquí se compara con lo que la página tiene guardado para ese año, por nivel de gobierno. <b>Coincide</b>: la diferencia no pasa de S/ 5 por mes.
          <b>Mes en curso</b>: del año actual, el MEF ya suma lo devengado en el mes abierto, que la página trae cuando se cierra. <b>Revisar</b>: falta o sobra algo.</p>
        ${x.length ? bloques.map((b) => `<div class="caja"><h3>${esc(b)}</h3><div class="scroll"><table><tr><th>Año</th><th>Nivel</th><th>Meses en la página</th><th class="n">Publicado por el MEF (S/)</th><th class="n">En la página (S/)</th><th class="n">Diferencia (S/)</th><th>Estado</th><th>Consultado</th></tr>
            ${x.filter((f) => f.bloque === b).map((f) => `<tr><td>${f.anio}</td><td>${esc(f.nivel)}</td><td>${esc(f.meses)}</td><td class="n">${sol(f.mef)}</td><td class="n">${sol(f.pagina)}</td>
              <td class="n ${f.estado === "revisar" ? "baja" : ""}">${f.dif > 0 ? "+" : ""}${sol(f.dif)}</td><td>${chip[f.estado]}</td><td>${f.fecha ? esc(fecha(f.fecha)) : ""}</td></tr>`).join("")}</table></div></div>`).join("")
          : '<div class="vacio-caja"><b>Todavía no hay controles del MEF guardados.</b><span>Se guardan solos en la próxima corrida del scraper del MEF (sus CSV de CONTROL), o subiendo esos CSV en «Subir archivos».</span></div>'}
        <p class="nota">Si algo sale en «revisar», vuelve a correr el scraper para ese año: reemplaza los meses y vuelve a consultar la vista anual.</p>`;
    } catch (e) { caja.innerHTML = `<div class="err-box"><b>No se pudo comparar</b><span>${esc(e.message)}</span></div>`; }
  }

  // ── Carga de archivos y scrapers de GitHub ──
  function resultado(r, tit, ok) {
    const filas = Object.entries(r.bases).map(([k, x]) => `<li>${esc(base(k).nombre)}: ${fmt(x.filas)} filas · ${x.departamentos.length} departamento(s) · ${esc(x.periodos.length === 1 ? x.periodos[0] : `${x.periodos[0]} a ${x.periodos[x.periodos.length - 1]}`)}</li>`).join("");
    return `<div class="${ok ? "ok-box" : "err-box"}"><b>${esc(tit)}</b>${filas ? `<ul>${filas}</ul>` : ""}${r.avisos.map((x) => `<span>${esc(x)}</span>`).join("")}</div>`;
  }
  function cajaSubida(clave, texto) {

      setTimeout(vuelta, 4000); sondeo = setInterval(vuelta, 20000);
    };
    $(`${cual}-lanzar`).addEventListener("click", async () => {
      const btn = $(`${cual}-lanzar`), res = $(`${cual}-res`); btn.disabled = true;
      const q = cual === "mef" ? `/v1/mef/actualizar?${new URLSearchParams({ desde: $("mef-d").value, hasta: $("mef-h").value, prueba: $("mef-prueba").checked })}`

      cuerpo = `<p class="lead">Las bases del MEF con cualquier departamento del país, en un Excel con el formato de PIM_Funcion.xlsx.</p>
        <div class="caja"><h3>1. Departamentos</h3><div class="fila"><button class="btn sec" type="button" data-deps="todos">Los 25</button><button class="btn sec" type="button" data-deps="lsu">Loreto · San Martín · Ucayali</button><button class="btn sec" type="button" data-deps="ninguno">Ninguno</button></div>
          <div class="deptos">${deps.map((d) => `<label for="dep-${d.codigo}"><input type="checkbox" class="dep" id="dep-${d.codigo}" value="${d.codigo}" ${marcados.includes(d.codigo) ? "checked" : ""}>${esc(titulo(d.nombre))}</label>`).join("")}</div></div>
        <div class="caja"><h3>2. Bases y periodo</h3>${panelBases("p-mef", [...NACIONAL, "inv-dev-fuente", ...GASTO], { deptos: () => paneles.mefDeps, alcance: true, marcar: 3, desde: MESES.includes("2025-01") ? "2025-01" : MESES[0] })}
          <p class="nota">Las bases marcadas «LOR · SMN · UCA» solo tienen esas tres regiones: con otros departamentos, esas hojas salen vacías y la página lo avisa.</p></div>`;
    } else if (id === "empleo-long") {
      const E = CAT.empleo, sel = paneles.empReg || (paneles.empReg = E.grupos[Object.keys(E.grupos)[0]].slice());
      cuerpo = `<p class="lead">El empleo del MTPE en el formato LONG que genera el scraper (AÑO, MES, REGIÓN, ACTIVIDAD_ECONOMICA, EMPLEO), de una región, de un grupo o de todas.</p>
        <div class="caja"><h3>1. Regiones</h3><div class="fila">${Object.keys(E.grupos).map((g) => `<button class="btn sec" type="button" data-empg="${esc(g)}">${esc(g)}</button>`).join("")}
          <button class="btn sec" type="button" data-empg="*">Todas (${E.regiones.length})</button><button class="btn sec" type="button" data-empg="">Ninguna</button></div>
          <div class="deptos">${E.regiones.map((r, i) => `<label for="er-${i}"><input type="checkbox" class="emp-reg" id="er-${i}" value="${esc(r)}" ${sel.includes(r) ? "checked" : ""}>${esc(r)}</label>`).join("")}</div>
          <p class="nota">Los grupos solo marcan las casillas: se puede combinar cualquier región. El total «Perú» del tablero no se guarda.</p></div>
        <div class="caja"><h3>2. Periodo y formato</h3>${cajaLong(null)}</div>`;
    } else if (id === "bases") {
      cuerpo = `<p class="lead">Pesca y empleo de las tres regiones juntas, para comparar.</p>
        <div class="caja"><h3>Pesca</h3>${panelBases("p-cpesca", ["pesca-loreto", "pesca-san-martin", "pesca-ucayali"], { deptos: () => LSU, marcar: 3 })}</div>
        <div class="caja"><h3>Empleo</h3>${panelBases("p-cempleo", ["empleo"], { deptos: () => LSU, marcar: 1 })}</div>`;
    } else if (id === "act-mef") cuerpo = cajaScraper("mef");
    else if (id === "act-empleo") cuerpo = cajaScraper("empleo");
    else if (id === "act-hidro") cuerpo = '<div class="caja"><h3>Hidrocarburos: PERUPETRO → página</h3><div id="hidro-caja"></div></div>';
    else if (id === "act-archivos") cuerpo = cajaSubida("sub-todo", "Cualquier archivo que entienda la página: el .zip de Fiscal/Scrapeo/output, CSV del scraper o PIM_Funcion.xlsx (MEF); los Excel de las DIREPRO o los LONG de los notebooks (pesca); el Excel del scraper de empleo o el ESTAD de una región (exportaciones e importaciones). La página reconoce de qué sector y región es cada uno. Se reemplazan los meses y departamentos que traigan los archivos; lo demás se conserva.");
    else if (id === "estado") {
      const u = ESTADO.ultima_carga;
      cuerpo = `<div class="stats"><div class="stat"><small>Datos hasta</small><b>${esc(etqMes(datosHasta()))}</b><span>último mes con datos</span></div>
          <div class="stat"><small>Última carga</small><b style="font-size:17px">${u ? esc(fecha(u.fecha)) : "—"}</b><span>${u ? esc(u.origen) : "todavía no se cargó nada"}</span></div></div>
        <div class="caja"><div class="scroll"><table><tr><th>Base</th><th>Grupo</th><th>Datos</th><th>Departamentos</th><th class="n">Filas</th></tr>
        ${CAT.bases.map((b) => { const x = ESTADO.bases[b.id], ds = x.departamentos;
          return `<tr><td>${esc(b.nombre)}</td><td>${esc(CAT.grupos[b.grupo].split(" · ")[0])}</td><td>${x.filas ? `${esc(etqMes(x.desde))} – ${esc(etqMes(x.hasta))}` : "sin datos"}</td>
            <td>${ds.length > 6 ? `${ds.length} departamentos` : ds.map((c) => titulo(CAT.departamentos.find((d) => d.codigo === c).nombre)).join(", ") || "—"}</td><td class="n">${fmt(x.filas)}</td></tr>`; }).join("")}</table></div></div>`;
    } else cuerpo = `<p class="lead">Valores que usan los cálculos de las tres regiones.</p><div class="caja"><div class="scroll"><table><tr><th>Parámetro</th><th class="n">Valor</th><th>Usado en</th></tr>
        <tr><td>Precio base 2007 · pescado fresco</td><td class="n">3 275,04 S/ por t</td><td>VBP pesca</td></tr><tr><td>Precio base 2007 · seco salado</td><td class="n">2 987,78 S/ por t</td><td>VBP pesca</td></tr>
        <tr><td>Precio base 2007 · salpreso</td><td class="n">3 015,89 S/ por t</td><td>VBP pesca</td></tr><tr><td>Precio base 2007 · peces ornamentales</td><td class="n">1 032,90 S/ por mil unidades</td><td>VBP pesca</td></tr></table></div>
        <p class="nota">Están en el código (FISCAL/api/app/pesca.py y los notebooks de PESCA); aquí se muestran para consulta.</p></div>`;
    return `<div><div class="ruta"><b>Las tres regiones</b></div><h1>${esc(C[id])}</h1></div>${cuerpo}`;
  }

  // ── Navegación ──
  function datosHasta() { const h = Object.values(ESTADO.bases).map((x) => x.hasta).filter((x) => x && x.length === 7).sort(); return h.length ? h[h.length - 1] : null; }
  function pintarHasta() { const h = datosHasta(); $("datos-hasta").innerHTML = h ? `Datos hasta <b>${esc(etqMes(h))}</b>` : "Sin datos cargados"; }
  function mostrar() {
    let [g, ...resto] = (location.hash.slice(1) || "lor-resumen").split("-");
    if (g === "actualizar") { g = "tres"; resto = ["act", "archivos"]; }
    grupo = GRUPOS[g] ? g : "lor";
    const ids = planos(grupo), pedido = resto.join("-");
    id = ids.includes(pedido) ? pedido : ids[0];
    pintarGrupos(); pintarIndice();
    const oculto = $("marco").classList.contains("sin-indice");
    $("sector").innerHTML = `<div class="cuerpo">${oculto ? '<button class="mostrar" type="button" id="mostrar">Mostrar índice</button>' : ""}${GRUPOS[grupo].comun ? seccionComun() : sectorRegion()}</div>`;
    if (oculto) $("mostrar").addEventListener("click", () => { $("marco").classList.remove("sin-indice"); mostrar(); });
    document.querySelectorAll("#sector [data-tab]").forEach((b) => b.addEventListener("click", () => { pestana[grupo + id] = b.dataset.tab; mostrar(); }));
    document.querySelectorAll("#sector [data-ir]").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.ir; }));
    document.querySelectorAll("#sector [data-deps]").forEach((b) => b.addEventListener("click", () => {
      const deps = CAT.departamentos.filter((d) => d.codigo !== "98").map((d) => d.codigo);
      paneles.mefDeps = b.dataset.deps === "todos" ? deps : b.dataset.deps === "lsu" ? LSU.slice() : [];
      document.querySelectorAll(".dep").forEach((c) => { c.checked = paneles.mefDeps.includes(c.value); }); vistaPrevia("p-mef");
    }));
    document.querySelectorAll("#sector .dep").forEach((c) => c.addEventListener("change", () => { paneles.mefDeps = [...document.querySelectorAll(".dep")].filter((x) => x.checked).map((x) => x.value); vistaPrevia("p-mef"); }));
    if ($("el-vista")) atarEmpleoLong();
    Object.keys(paneles).forEach((k) => { if (k.startsWith("p-")) atarPanel(k); });
    ["sub-todo", "sub-emp", "sub-hidro", "sub-lor", "sub-smn", "sub-uca", "sub-estad", "sub-sunat"].forEach(atarSubida);
    atarScraper("mef"); atarScraper("empleo");
    if ($("hidro-caja")) cajaHidro($("hidro-caja"));
    if ($("cuadros-empleo")) cuadrosEmpleo(REG[grupo], $("cuadros-empleo"));
    if ($("cuadros-hidro")) cuadrosHidro(REG[grupo], $("cuadros-hidro"));
    if ($("cuadros-pesca")) cuadrosPesca(REG[grupo], $("cuadros-pesca"));
    if ($("sunat-expo")) sunatExpo(REG[grupo], $("sunat-expo"));
    if ($("resumen-sunat")) resumenSunat(REG[grupo], $("resumen-sunat"));
    if ($("cuadros-expo")) cuadrosExpo(REG[grupo], $("cuadros-expo"), $("cuadros-expo").dataset.flujo);
    if ($("cuadros-ejec")) cuadrosEjecucion($("cuadros-ejec").dataset.sector, REG[grupo], $("cuadros-ejec"));
    if ($("variaciones")) variacionesAlarmantes(REG[grupo], $("variaciones"));
    if ($("proyectos")) proyectosVariaciones(REG[grupo], $("proyectos"));
    if ($("archivos-fiscal")) archivosFiscales(REG[grupo], $("archivos-fiscal"));
    if ($("bcrp")) cuadrosBCRP($("bcrp").dataset.sector, REG[grupo], $("bcrp"));
    if ($("anexos-bcrp")) anexosBCRP(REG[grupo], $("anexos-bcrp"));
    if ($("contraste")) contrasteMEF($("contraste").dataset.sector, REG[grupo], $("contraste"));
    window.scrollTo(0, 0);
  }
  $("sel-movil").addEventListener("change", (ev) => { location.hash = ev.target.value; });
  $("ocultar").addEventListener("click", () => { $("marco").classList.add("sin-indice"); mostrar(); });
  window.addEventListener("hashchange", mostrar);

  (async function iniciar() {
    try { [CAT, ESTADO] = await Promise.all([api("/v1/catalogo"), api("/v1/estado")]); }
    catch (e) { $("sector").innerHTML = `<div class="cuerpo"><div class="err-box"><b>No se pudo conectar con el API</b><span>${esc(e.message)}</span></div></div>`; return; }
    const hoy = new Date(), tope = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`;
    for (let a = 2006; a <= hoy.getFullYear(); a++) for (let m = 1; m <= 12; m++) { const ym = `${a}-${String(m).padStart(2, "0")}`; if (ym <= tope) MESES.push(ym); }
    pintarHasta(); mostrar();
  })();
})();
</script>
</body>
</html>
