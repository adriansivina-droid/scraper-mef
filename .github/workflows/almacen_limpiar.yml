# Limpieza del almacén de archivos de la página (tabla «almacen» en Neon): borra lo repetido o lo que ya nadie usa
# (CSV contenidos en otro de mayor rango, capturas de error viejas, capas del mapa que la última corrida no regeneró) y
# compacta la tabla para devolver el espacio. Reglas en FISCAL/api/app/almacen.py (duplicados()). También quita los
# gráficos DRAE innecesarios (FISCAL/api/app/drae.py, innecesarios()).
# Antes pasa a binario los archivos que quedaron guardados en texto (base64, un tercio más grandes): almacen.convertir().
# No cambia su contenido y se puede repetir; sin «aplicar» solo dice cuánto ahorraría.
#   · solo: el día 1 de cada mes, 09:17 hora de Lima (borra de verdad)
#   · a mano: Actions → «Almacén · limpiar» → Run workflow. Sin «aplicar» solo lista lo que borraría.
# Requiere el secreto DATABASE_URL.
name: Almacén · limpiar

on:
  schedule:
    - cron: "17 14 1 * *"          # 14:17 UTC = 09:17 en Lima, día 1 de cada mes
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Borrar de verdad (sin marcar, solo lista)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FISCAL/api/requirements.txt
      - run: pip install -r FISCAL/api/requirements.txt
      - name: Limpiar
        working-directory: FISCAL/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APLICAR: ${{ github.event_name == 'schedule' || inputs.aplicar }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import text
          from app import almacen, db
          def tam():
              with db.motor().connect() as cx:
                  return cx.execute(text("SELECT pg_total_relation_size('almacen'), pg_database_size(current_database())")).one()
          a0, d0 = tam()
          aplicar = os.environ.get("APLICAR") == "true"
          c = almacen.convertir(aplicar=aplicar)
          r = almacen.limpiar(aplicar=aplicar)
          lineas = ["## Almacén · de texto a binario", "",
                    f"{c['pendientes']} archivos guardados en texto ({c['mb_antes']} MB) → {c['mb_despues']} MB en binario · "
                    + (f"{c['convertidos']} convertidos" if aplicar else "prueba: no se cambió nada")
                    + (f" · sin tocar (no se pudieron comprobar): {', '.join(c['sin_tocar'])}" if c["sin_tocar"] else ""), ""]
          lineas += [f"## Almacén · {'limpieza' if r['aplicado'] else 'prueba (no se borró nada)'}", "",
                    f"{len(r['archivos'])} archivos · {r['mb_liberados']} MB guardados en la base", "",
                    "| Archivo | Carpeta | KB | Motivo |", "|---|---|---|---|"]
          lineas += [f"| {x['nombre']} | {x['carpeta']} | {x['kb_guardado']:,} | {x['motivo']} |" for x in r["archivos"]]
          # gráficos DRAE innecesarios (duplicados, contenidos en otro, de un mes ya reemplazado): drae.innecesarios()
          from app import drae
          lineas += ["", "### Gráficos DRAE innecesarios", "", "| Región | N° | Hoja | Título | Motivo |", "|---|---|---|---|---|"]
          for d, nombre in (("16", "Loreto"), ("22", "San Martín"), ("25", "Ucayali")):
              for x in drae.depurar(d, aplicar=r["aplicado"]):
                  lineas.append(f"| {nombre} | {x['orden']} | {x['hoja']} | {(x['titulo'] or '')[:70]} | {x['motivo'][:90]} |")
          a1, d1 = tam()
          lineas += ["", f"Tabla almacen: {a0 / 2**20:.1f} → {a1 / 2**20:.1f} MB · base completa: {d0 / 2**20:.1f} → {d1 / 2**20:.1f} MB"]
          texto = "\n".join(lineas); print(texto)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(texto + "\n")
          PY
