# Proyectos detrás de las variaciones de la inversión: corre FISCAL/Fiscal_Proyectos.ipynb sin Colab y guarda los
# proyectos en la base del API (FISCAL/automatizacion/proyectos_servidor.py).
#   · solo, al terminar el scraper del MEF (con éxito): último mes con inversión en la base
#   · a mano: Actions → «Fiscal · proyectos de las variaciones» → Run workflow, o el botón de la pestaña «Proyectos»
# Requiere el secreto DATABASE_URL. Hace unas 45 consultas al MEF, sin apuro (Incapsula).
name: Fiscal · proyectos de las variaciones
run-name: "Proyectos de las variaciones · ${{ inputs.mes || 'último mes' }}"

on:
  workflow_run:
    workflows: ["Fiscal · scraper del MEF"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes a analizar (AAAA-MM). Vacío: el último con inversión en la base"
        type: string
        default: ""

concurrency:
  group: fiscal-proyectos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proyectos:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FISCAL/api/requirements.txt

      - name: Instalar librerías
        run: pip install -r FISCAL/api/requirements.txt beautifulsoup4==4.12.3

      - name: Consultar proyectos y cargar en la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MES: ${{ inputs.mes }}
          PYTHONUNBUFFERED: "1"
        run: |
          args=()
          [ -n "$MES" ] && args+=(--mes "$MES")
          python FISCAL/automatizacion/proyectos_servidor.py "${args[@]}"
