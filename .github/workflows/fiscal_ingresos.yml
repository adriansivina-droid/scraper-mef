# Ingresos del MEF (Consulta Amigable de Ingresos) de los gobiernos regionales y locales de Loreto, San Martín y Ucayali,
# para las hojas INGRESOS G.R. y G.L. del ESTAD (Ejecución del presupuesto → ESTAD). Los guarda en la base «ingresos».
#   · automático: el día 2 de cada mes, después del scraper del gasto (año en curso; en enero, también el anterior)
#   · a mano: Actions → «Fiscal · ingresos del MEF» → Run workflow (eliges los años, p. ej. 2022-2026)
# Requiere el secreto DATABASE_URL.
name: Fiscal · ingresos del MEF

on:
  schedule:
    - cron: "0 14 2 * *"
  workflow_dispatch:
    inputs:
      anios:
        description: "Años: AAAA o AAAA-AAAA (vacío: el año en curso)"
        default: ""

concurrency:
  group: fiscal-ingresos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingresos:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: PAGINA/requirements.txt
      - run: pip install -r PAGINA/requirements.txt beautifulsoup4==4.12.3
      - name: Bajar y cargar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANIOS: ${{ inputs.anios }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$ANIOS" ]; then
            Y=$(TZ=America/Lima date +%Y); M=$(TZ=America/Lima date +%-m)
            if [ "$M" = "1" ]; then ANIOS="$((Y-1))-$Y"; else ANIOS="$Y"; fi
          fi
          python FISCAL/automatizacion/ingresos_mef.py --anios "$ANIOS" --salida "$RUNNER_TEMP/ingresos" --cargar
      - name: Guardar el CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingresos-mef
          path: ${{ runner.temp }}/ingresos
          retention-days: 30
          if-no-files-found: ignore
