# Fase 2 · scraper del MEF en el servidor: corre FISCAL/notebooks/Fiscal_Scraper.ipynb sin Colab y carga lo que baja en la base de
# datos del API (Neon), igual que subir el .zip de Scrapeo/output en la página.
#   · cada mes, el día 2 (06:00 hora de Lima): año en curso hasta el último mes cerrado (el MEF ajusta los meses
#     anteriores, por eso se vuelve a bajar todo el año), en dos tramos seguidos (enero-junio y julio en adelante), cada
#     uno en su job: con 3 consultas simultáneas el año entero no entra en las 6 horas de un job
#   · a mano: Actions → «Fiscal · scraper del MEF» → Run workflow (eliges el periodo) o el botón «Actualizar desde el MEF»
# Requiere el secreto DATABASE_URL. Los CSV quedan como artefacto de la corrida (30 días).
name: Fiscal · scraper del MEF
run-name: "Scraper del MEF · ${{ inputs.desde || 'año en curso' }}${{ inputs.hasta && format(' a {0}', inputs.hasta) || '' }}${{ inputs.superficial && ' · solo función y genérica' || '' }}${{ (inputs.niveles || inputs.bloques || inputs.regiones) && format(' · corrección {0} {1} {2}', inputs.niveles, inputs.bloques, inputs.regiones) || '' }}${{ inputs.prueba && ' · PRUEBA' || '' }}"

on:
  schedule:
    - cron: "0 11 2 * *"           # 11:00 UTC = 06:00 en Lima
  workflow_dispatch:
    inputs:
      desde:
        description: "Desde (AAAA-MM). Vacío: el año en curso, en dos tramos. Con periodo: un solo job (hasta ~10 meses)"
        type: string
        default: ""
      hasta:
        description: "Hasta (AAAA-MM). Vacío: último mes cerrado"
        type: string
        default: ""
      prueba:
        description: "Prueba rápida (solo el mes «desde» y Loreto; no carga en la base)"
        type: boolean
        default: false
      superficial:
        description: "Años anteriores para los gráficos: solo devengado por función y genérica de LOR, SMN y UCA (sin PIM ni detalle municipal), en 3 jobs"
        type: boolean
        default: false
      niveles:
        description: "Corrección dirigida: niveles (E, R, M separados por comas). Vacío: los tres"
        type: string
        default: ""
      bloques:
        description: "Corrección dirigida: bloques (Funcion, Generica, Fuente, InvFuente, Deuda). Vacío: todos"
        type: string
        default: ""
      regiones:
        description: "Corrección dirigida: departamentos (16, 22, 25). Vacío: los tres"
        type: string
        default: ""
      consultas:
        description: "Consultas simultáneas al MEF (con 6 salieron errores de «la URL no aplicó el filtro»)"
        type: string
        default: "3"

concurrency:
  group: fiscal-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  raspar:
    strategy:
      max-parallel: 1                    # los tramos van uno tras otro (en paralelo serían 6 consultas al MEF)
      fail-fast: false
      matrix:
        tramo: [1, 2, 3]                 # el 3 solo con «superficial» (periodos largos de años anteriores)
    name: raspar (tramo ${{ matrix.tramo }})
    runs-on: ubuntu-latest
    timeout-minutes: 355                 # máximo de GitHub: 360 (con 25 departamentos, mejor un año por corrida)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: PAGINA/requirements.txt

      - name: Instalar librerías
        run: pip install -r PAGINA/requirements.txt beautifulsoup4==4.12.3 tqdm==4.67.1

      - name: Raspar el MEF y cargar en la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          PRUEBA: ${{ inputs.prueba }}
          SUPERFICIAL: ${{ inputs.superficial }}
          NIVELES: ${{ inputs.niveles }}
          BLOQUES: ${{ inputs.bloques }}
          REGIONES: ${{ inputs.regiones }}
          FISCAL_WORKERS: ${{ inputs.consultas || '3' }}
          TRAMO: ${{ matrix.tramo }}
          FISCAL_TRABAJO: ${{ runner.temp }}/fiscal
          PYTHONUNBUFFERED: "1"            # el avance se ve en vivo en los registros (sin esto sale todo al final)
        run: |
          if [ "$SUPERFICIAL" = "true" ] && [ "$PRUEBA" != "true" ]; then
            # años anteriores: el periodo elegido, partido en 3 jobs seguidos
            [ -z "$DESDE" ] || [ -z "$HASTA" ] && { echo "::error::Con «superficial» hay que poner desde y hasta"; exit 1; }
            python FISCAL/automatizacion/scraper_servidor.py --superficial --desde "$DESDE" --hasta "$HASTA" --partes 3 --tramo "$TRAMO"
            exit $?
          fi
          [ "$TRAMO" = "3" ] && { echo "El tramo 3 es solo para corridas «superficial»."; exit 0; }
          if [ -n "$DESDE$HASTA" ] || [ "$PRUEBA" = "true" ]; then
            # con periodo elegido (o prueba) corre todo en el tramo 1
            [ "$TRAMO" = "2" ] && { echo "Periodo elegido a mano: todo va en el tramo 1."; exit 0; }
          fi
          args=()
          [ -z "$DESDE$HASTA" ] && [ "$PRUEBA" != "true" ] && args+=(--tramo "$TRAMO")
          [ -n "$DESDE" ] && args+=(--desde "$DESDE")
          [ -n "$HASTA" ] && args+=(--hasta "$HASTA")
          [ "$PRUEBA" = "true" ] && args+=(--prueba)
          [ "$SUPERFICIAL" = "true" ] && args+=(--superficial)
          [ -n "$NIVELES" ] && args+=(--niveles "$NIVELES")
          [ -n "$BLOQUES" ] && args+=(--bloques "$BLOQUES")
          [ -n "$REGIONES" ] && args+=(--regiones "$REGIONES")
          python FISCAL/automatizacion/scraper_servidor.py "${args[@]}"

      - name: Guardar los CSV como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapeo-output-tramo${{ matrix.tramo }}
          path: ${{ runner.temp }}/fiscal/Fiscal/Scrapeo/output
          retention-days: 30
          if-no-files-found: ignore
