# Fase 2 · scraper del MEF en el servidor: corre FISCAL/Fiscal_Scraper.ipynb sin Colab y carga lo que baja en la base de
# datos del API (Neon), igual que subir el .zip de Scrapeo/output en la página.
#   · cada mes, los días 2 y 21 (06:00 hora de Lima): año en curso hasta el último mes cerrado (el MEF ajusta los meses
#     anteriores, por eso se vuelve a bajar todo el año)
#   · a mano: Actions → «Fiscal · scraper del MEF» → Run workflow (eliges el periodo) o el botón «Actualizar desde el MEF»
# Requiere el secreto DATABASE_URL. Los CSV quedan como artefacto de la corrida (30 días).
name: Fiscal · scraper del MEF
run-name: "Scraper del MEF · ${{ inputs.desde || 'año en curso' }}${{ inputs.hasta && format(' a {0}', inputs.hasta) || '' }}${{ inputs.prueba && ' · PRUEBA' || '' }}"

on:
  schedule:
    - cron: "0 11 2,21 * *"        # 11:00 UTC = 06:00 en Lima
  workflow_dispatch:
    inputs:
      desde:
        description: "Desde (AAAA-MM). Vacío: enero del año en curso"
        type: string
        default: ""
      hasta:
        description: "Hasta (AAAA-MM). Vacío: último mes cerrado"
        type: string
        default: ""
      prueba:
        description: "Prueba rápida (solo el mes «desde» y Loreto; no carga en la base)"
        type: boolean
        default: false
      consultas:
        description: "Consultas simultáneas al MEF (bájalo a 2-3 si salen errores de «la URL no aplicó el filtro»)"
        type: string
        default: "6"

concurrency:
  group: fiscal-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  raspar:
    runs-on: ubuntu-latest
    timeout-minutes: 355                 # máximo de GitHub: 360 (con 25 departamentos, mejor un año por corrida)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FISCAL/api/requirements.txt

      - name: Instalar librerías
        run: pip install -r FISCAL/api/requirements.txt beautifulsoup4==4.12.3 tqdm==4.67.1

      - name: Raspar el MEF y cargar en la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          PRUEBA: ${{ inputs.prueba }}
          FISCAL_WORKERS: ${{ inputs.consultas || '6' }}
          FISCAL_TRABAJO: ${{ runner.temp }}/fiscal
          PYTHONUNBUFFERED: "1"            # el avance se ve en vivo en los registros (sin esto sale todo al final)
        run: |
          args=()
          [ -n "$DESDE" ] && args+=(--desde "$DESDE")
          [ -n "$HASTA" ] && args+=(--hasta "$HASTA")
          [ "$PRUEBA" = "true" ] && args+=(--prueba)
          python FISCAL/automatizacion/scraper_servidor.py "${args[@]}"

      - name: Guardar los CSV como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapeo-output
          path: ${{ runner.temp }}/fiscal/Fiscal/Scrapeo/output
          retention-days: 30
          if-no-files-found: ignore
