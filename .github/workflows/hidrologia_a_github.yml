# Una sola vez: copia el historial de hidrología de la página (tabla «senamhi_crudo» de Neon) a la Release
# «hidrologia-datos» (hidrologia.sqlite) y publica los CSV para Power BI. Después, «Hidrología · actualización» trabaja
# solo con la Release. Solo lee Neon. Si la Release ya tiene hidrologia.sqlite, no hace nada.
# Requiere el secreto DATABASE_URL.
name: Hidrología · pasar a GitHub

on:
  workflow_dispatch:

concurrency:
  group: hidrologia-actualizar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pasar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FISCAL/api/requirements.txt

      - name: Instalar librerías
        run: pip install -r FISCAL/api/requirements.txt

      - name: Revisar la Release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view hidrologia-datos --json assets -q '.assets[].name' 2>/dev/null | grep -qx hidrologia.sqlite; then
            echo "La Release ya tiene hidrologia.sqlite: no se copia de nuevo." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "hecho=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Copiar de Neon y crear la Release
        if: steps.rel.outputs.hecho != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          NEON_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python HIDROLOGIA/powerbi/respaldo_desde_neon.py "$RUNNER_TEMP/hidrologia.sqlite" | tee -a "$GITHUB_STEP_SUMMARY"
          gh release view hidrologia-datos >/dev/null 2>&1 || gh release create hidrologia-datos \
            --title "Hidrología · datos para Power BI" --latest=false \
            --notes "Nivel y caudal de los ríos (SENAMHI). Para actualizar: Edit → arrastra aquí el SENAMHI_crudo_AAAA-MM-DD.json del recolector → Update release. GitHub lo suma al historial (hidrologia.sqlite) y rearma los CSV en unos minutos. Power BI los lee con el enlace fijo https://github.com/${{ github.repository }}/releases/download/hidrologia-datos/<archivo>."
          gh release upload hidrologia-datos "$RUNNER_TEMP/hidrologia.sqlite" --clobber

      - name: Armar y publicar los CSV
        if: steps.rel.outputs.hecho != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash HIDROLOGIA/powerbi/publicar_release.sh
