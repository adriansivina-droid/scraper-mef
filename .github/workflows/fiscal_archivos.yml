# Scrapers propios de los tres archivos del MEF con los 25 departamentos, independientes del resto de la base fiscal:
#   · dev-municipalidad → DEV Funcion.Municipalidad (devengado 2.6 por función y municipalidad, mensual)
#   · pim-funcion       → PIM Funcion (PIM 2.6 por función y nivel de gobierno, anual)
#   · pim-municipalidad → PIM Funcion.Municipalidad (PIM 2.6 por función y municipalidad, anual)
# Corre el mismo notebook (FISCAL/notebooks/Fiscal_Scraper.ipynb) solo con el bloque de ese archivo y carga en la base solo esa base.
# Se lanza desde la página («MEF · 3 archivos» → Actualizar) o a mano: Actions → este flujo → Run workflow.
# Además, al terminar con éxito la corrida mensual programada del scraper completo (fiscal_scraper.yml, día 2), vuelve a
# bajar el devengado municipal (dev-municipalidad) de todo el AÑO ANTERIOR, en cuatro tramos: el scraper completo ya trae el
# año en curso, así que la serie municipal queda al día desde enero del año anterior hasta el último mes cerrado.
name: Fiscal · archivo del MEF (25 departamentos)
run-name: "${{ inputs.archivo || 'dev-municipalidad' }} · ${{ github.event_name == 'workflow_run' && 'año anterior (mensual)' || inputs.desde || 'año en curso' }}${{ inputs.hasta && format(' a {0}', inputs.hasta) || '' }}${{ inputs.departamentos != 'TODOS' && format(' · {0}', inputs.departamentos) || '' }}${{ inputs.funciones && format(' · funciones {0}', inputs.funciones) || '' }}${{ inputs.prueba && ' · PRUEBA' || '' }}"

on:
  workflow_run:
    workflows: ["Fiscal · scraper del MEF"]
    types: [completed]
  workflow_dispatch:
    inputs:
      archivo:
        description: "Archivo"
        type: choice
        options: [dev-municipalidad, pim-funcion, pim-municipalidad]
        default: dev-municipalidad
      desde:
        description: "Desde (AAAA-MM; en PIM cuenta solo el año). Vacío: año en curso (el devengado, en dos tramos)"
        type: string
        default: ""
      hasta:
        description: "Hasta (AAAA-MM). Vacío: último mes cerrado (PIM: el mismo año de «desde»)"
        type: string
        default: ""
      departamentos:
        description: "TODOS o códigos separados por comas (16,22,25)"
        type: string
        default: "TODOS"
      funciones:
        description: "Solo dev-municipalidad: remiendo de solo esas funciones (códigos separados por comas, p. ej. 13,15). Vacío: todas"
        type: string
        default: ""
      prueba:
        description: "Prueba rápida (un mes, solo Loreto; no carga en la base)"
        type: boolean
        default: false

concurrency:
  group: fiscal-archivo-${{ inputs.archivo || 'dev-municipalidad' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  raspar:
    # tras el scraper completo: solo si fue la corrida mensual programada y terminó bien
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule')
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        tramo: [1, 2, 3, 4]
    name: raspar (tramo ${{ matrix.tramo }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Parámetros
        id: par
        env:
          EVENTO: ${{ github.event_name }}
          ARCHIVO: ${{ inputs.archivo }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          DEPARTAMENTOS: ${{ inputs.departamentos }}
        run: |
          if [ "$EVENTO" = "workflow_run" ]; then
            # año anterior al del último mes cerrado (en enero, el último mes cerrado es diciembre del año pasado)
            y=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y); y=$((y - 1))
            ARCHIVO=dev-municipalidad; DESDE="$y-01"; HASTA="$y-12"; DEPARTAMENTOS=TODOS
          fi
          { echo "archivo=$ARCHIVO"; echo "desde=$DESDE"; echo "hasta=$HASTA"; echo "departamentos=${DEPARTAMENTOS:-TODOS}"; } >> "$GITHUB_OUTPUT"
          echo "$ARCHIVO · ${DESDE:-año en curso} a ${HASTA:-último mes cerrado} · ${DEPARTAMENTOS:-TODOS}"

      - name: ¿Hace falta este tramo?
        id: tramo
        env:
          TRAMO: ${{ matrix.tramo }}
          ARCHIVO: ${{ steps.par.outputs.archivo }}
          PERIODO: ${{ steps.par.outputs.desde }}${{ steps.par.outputs.hasta }}
          PRUEBA: ${{ inputs.prueba }}
          FUNCIONES: ${{ inputs.funciones }}
        run: |
          # un remiendo de algunas funciones es corto (unas pocas consultas por mes): va entero en el tramo 1
          # devengado municipal: el año en curso va en dos tramos (enero-junio, julio-último mes); un periodo elegido se parte en
          # cuatro tramos seguidos (cerca de una hora por mes con los 25 departamentos; cada job tiene 6 horas).
          # PIM (anual) y la prueba van enteros en el tramo 1.
          if [ "$TRAMO" != "1" ] && { [ "$ARCHIVO" != "dev-municipalidad" ] || [ "$PRUEBA" = "true" ] || [ -n "$FUNCIONES" ] || { [ -z "$PERIODO" ] && [ "$TRAMO" -gt 2 ]; }; }; then
            echo "correr=no" >> "$GITHUB_OUTPUT"; echo "Este tramo no hace falta."
          else
            echo "correr=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tramo.outputs.correr == 'si'

      - uses: actions/setup-python@v5
        if: steps.tramo.outputs.correr == 'si'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FISCAL/api/requirements.txt

      - name: Instalar librerías
        if: steps.tramo.outputs.correr == 'si'
        run: pip install -r FISCAL/api/requirements.txt beautifulsoup4==4.12.3 tqdm==4.67.1

      - name: Raspar el MEF y cargar en la base de datos
        if: steps.tramo.outputs.correr == 'si'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ARCHIVO: ${{ steps.par.outputs.archivo }}
          DESDE: ${{ steps.par.outputs.desde }}
          HASTA: ${{ steps.par.outputs.hasta }}
          DEPARTAMENTOS: ${{ steps.par.outputs.departamentos }}
          PRUEBA: ${{ inputs.prueba }}
          FUNCIONES: ${{ inputs.funciones }}
          FISCAL_WORKERS: "3"
          TRAMO: ${{ matrix.tramo }}
          FISCAL_TRABAJO: ${{ runner.temp }}/fiscal
          PYTHONUNBUFFERED: "1"
        run: |
          args=(--archivo "$ARCHIVO" --departamentos "${DEPARTAMENTOS:-TODOS}")
          if [ "$ARCHIVO" = "dev-municipalidad" ] && [ -n "$FUNCIONES" ]; then
            args+=(--funciones "$FUNCIONES")
          elif [ "$ARCHIVO" = "dev-municipalidad" ] && [ "$PRUEBA" != "true" ]; then
            args+=(--tramo "$TRAMO")
            [ -n "$DESDE$HASTA" ] && args+=(--partes 4)
          fi
          [ -n "$DESDE" ] && args+=(--desde "$DESDE")
          [ -n "$HASTA" ] && args+=(--hasta "$HASTA")
          [ "$PRUEBA" = "true" ] && args+=(--prueba)
          python FISCAL/automatizacion/scraper_servidor.py "${args[@]}"

      - name: Guardar los CSV como artefacto
        if: always() && steps.tramo.outputs.correr == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.par.outputs.archivo }}-tramo${{ matrix.tramo }}
          path: ${{ runner.temp }}/fiscal/Fiscal/Scrapeo/output
          retention-days: 14
          if-no-files-found: ignore
