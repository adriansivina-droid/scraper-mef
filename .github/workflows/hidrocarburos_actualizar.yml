# Actualización automática del Proyecto Petróleo (HIDROCARBUROS/): corre los notebooks sin Colab y guarda todo en la
# página (almacén de la base, FISCAL/api/app/almacen.py, en vez de Drive); al terminar carga la producción, el canon y
# el mapa en la página.
#   · diario (07:00 hora de Lima): producción de PERUPETRO (incluye la diaria, canon y regalías) → mapas
#   · mensual (el día 5): además, el canon municipal del MEF del año anterior y el actual
#   · a mano: Actions → «Hidrocarburos · actualización» → Run workflow (eliges diario o mensual), o el botón
#     «Actualizar desde PERUPETRO» de la página
# Requiere el secreto DATABASE_URL. Antes, una sola vez: «Hidrocarburos · migrar desde Drive» (copia lo que había en Drive).
name: Hidrocarburos · actualización

on:
  schedule:
    - cron: "0 12 * * *"           # 12:00 UTC = 07:00 en Lima (GitHub puede demorar unos minutos en arrancar)
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué actualizar"
        type: choice
        options: [diario, mensual]
        default: diario

concurrency:
  group: hidrocarburos-actualizar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            HIDROCARBUROS/automatizacion/requirements.txt
            FISCAL/api/requirements.txt

      - name: Instalar librerías
        run: pip install -r HIDROCARBUROS/automatizacion/requirements.txt -r FISCAL/api/requirements.txt

      - name: Elegir modo
        id: modo
        env:
          MODO_MANUAL: ${{ inputs.modo }}
        run: |
          M="$MODO_MANUAL"
          if [ -z "$M" ]; then
            if [ "$(TZ=America/Lima date +%d)" = "05" ]; then M=mensual; else M=diario; fi
          fi
          echo "modo=$M" >> "$GITHUB_OUTPUT"
          echo "Modo: $M"

      - name: Ejecutar notebooks y cargar en la página
        env:
          PP_TRABAJO: ${{ runner.temp }}/pp
          PP_ALMACEN: pagina
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python HIDROCARBUROS/automatizacion/ejecutar_notebooks.py "${{ steps.modo.outputs.modo }}"

      - name: Preparar el mapa para descargar
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/descarga"
          if [ -f "$RUNNER_TEMP/pp/PP_Mapa/PP_mapa_lotes_plus.html" ]; then
            cp "$RUNNER_TEMP/pp/PP_Mapa/PP_mapa_lotes_plus.html" "$RUNNER_TEMP/descarga/Mapa de Hidrocarburos - Perú.html"
          fi

      - name: Guardar el mapa (descargable desde la ejecución)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mapa de Hidrocarburos - Perú
          path: ${{ runner.temp }}/descarga/Mapa de Hidrocarburos - Perú.html
          retention-days: 14
          if-no-files-found: ignore
