# Actualización automática del Proyecto Petróleo (HIDROCARBUROS/): corre los notebooks sin Colab y guarda todo en la
# Release «hidrocarburos-datos» del repositorio: el almacén de los notebooks (almacen.sqlite, con DATA y CONTROL) y los
# CSV que lee Power BI (hidro_produccion.csv, hidro_canon.csv, …), con enlace fijo:
#   https://github.com/adriansivina-droid/scraper-mef/releases/download/hidrocarburos-datos/<archivo>
# Ya no usa Neon. Antes, una sola vez: «Hidrocarburos · pasar a GitHub» (copia lo que había en Neon).
#   · diario (07:00 hora de Lima): producción de PERUPETRO (incluye la diaria, canon y regalías) → mapas
#   · mensual (el día 5): además, el canon municipal del MEF del año anterior y el actual
#   · a mano: Actions → «Hidrocarburos · actualización» → Run workflow (eliges diario o mensual)
name: Hidrocarburos · actualización

on:
  schedule:
    - cron: "0 12 * * *"           # 12:00 UTC = 07:00 en Lima (GitHub puede demorar unos minutos en arrancar)
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué actualizar"
        type: choice
        options: [diario, mensual]
        default: diario

concurrency:
  group: hidrocarburos-actualizar
  cancel-in-progress: false

permissions:
  contents: write                    # para reemplazar los archivos de la Release

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            HIDROCARBUROS/automatizacion/requirements.txt
            FISCAL/api/requirements.txt

      - name: Instalar librerías
        run: pip install -r HIDROCARBUROS/automatizacion/requirements.txt -r FISCAL/api/requirements.txt

      - name: Elegir modo
        id: modo
        env:
          MODO_MANUAL: ${{ inputs.modo }}
        run: |
          M="$MODO_MANUAL"
          if [ -z "$M" ]; then
            if [ "$(TZ=America/Lima date +%d)" = "05" ]; then M=mensual; else M=diario; fi
          fi
          echo "modo=$M" >> "$GITHUB_OUTPUT"
          echo "Modo: $M"

      # los PDF anuales de PERUPETRO (DATA/PDF, ~450 MB) no van a la base: se guardan en la caché de GitHub entre corridas
      # (si se pierde, el notebook los vuelve a bajar de PERUPETRO)
      - name: Recuperar los PDF de PERUPETRO
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/almacen_local
          key: hidro-pdf-${{ github.run_id }}
          restore-keys: hidro-pdf-

      - name: Bajar el almacén de la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download hidrocarburos-datos -p almacen.sqlite -D "$RUNNER_TEMP" \
            || { echo "::error::No hay almacen.sqlite en la Release «hidrocarburos-datos»: corre antes «Hidrocarburos · pasar a GitHub»"; exit 1; }
          ls -la "$RUNNER_TEMP/almacen.sqlite"

      - name: Ejecutar notebooks y armar las bases
        id: notebooks
        env:
          PP_TRABAJO: ${{ runner.temp }}/pp
          PP_ALMACEN: pagina
          ALMACEN_LOCAL: ${{ runner.temp }}/almacen_local
          DATABASE_URL: sqlite:///${{ runner.temp }}/almacen.sqlite
          PYTHONUNBUFFERED: "1"
        run: python HIDROCARBUROS/automatizacion/ejecutar_notebooks.py "${{ steps.modo.outputs.modo }}"

      # aunque un notebook falle, se publica lo que quedó (lo anterior sigue en el almacén)
      - name: Publicar en la Release (almacén y CSV para Power BI)
        if: always() && steps.notebooks.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_URL: sqlite:///${{ runner.temp }}/almacen.sqlite
        run: |
          python HIDROCARBUROS/automatizacion/publicar_powerbi.py "$RUNNER_TEMP/powerbi"
          gh release upload hidrocarburos-datos "$RUNNER_TEMP/almacen.sqlite" "$RUNNER_TEMP"/powerbi/* --clobber
          cat "$RUNNER_TEMP/powerbi/LEEME.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar los PDF de PERUPETRO
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/almacen_local
          key: hidro-pdf-${{ github.run_id }}

      - name: Preparar el mapa para descargar
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/descarga"
          if [ -f "$RUNNER_TEMP/pp/PP_Mapa/PP_mapa_lotes_plus.html" ]; then
            cp "$RUNNER_TEMP/pp/PP_Mapa/PP_mapa_lotes_plus.html" "$RUNNER_TEMP/descarga/Mapa de Hidrocarburos - Perú.html"
          fi

      - name: Guardar el mapa (descargable desde la ejecución)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mapa de Hidrocarburos - Perú
          path: ${{ runner.temp }}/descarga/Mapa de Hidrocarburos - Perú.html
          retention-days: 14
          if-no-files-found: ignore
