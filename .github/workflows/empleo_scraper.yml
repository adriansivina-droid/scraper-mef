# Empleo · scraper del MTPE en el servidor: corre EMPLEO/Scraping_MTPE_Empleo_x_Region_Actividad.ipynb sin Colab (Power BI
# del MTPE con Playwright) y carga el Excel en la base de datos del API (Neon), igual que subirlo en la página.
#   · cada mes, los días 2 y 21 (07:30 hora de Lima): Loreto, San Martín y Ucayali
#   · a mano: Actions → «Empleo · scraper del MTPE» → Run workflow, o el botón «Actualizar empleo» de la página
# Requiere el secreto DATABASE_URL. El Excel queda como artefacto de la corrida (30 días).
name: Empleo · scraper del MTPE
run-name: "Scraper de empleo · ${{ inputs.regiones || 'LOR,SMN,UCA' }}"

on:
  schedule:
    - cron: "30 12 2,21 * *"       # 12:30 UTC = 07:30 en Lima
  workflow_dispatch:
    inputs:
      regiones:
        description: "Regiones"
        type: choice
        options: ["LOR,SMN,UCA", "TODAS"]
        default: "LOR,SMN,UCA"

concurrency:
  group: empleo-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  raspar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FISCAL/api/requirements.txt

      - name: Instalar librerías y Chromium
        run: |
          pip install -r FISCAL/api/requirements.txt playwright==1.56.0 pytesseract==0.3.13 pillow==11.0.0
          python -m playwright install --with-deps chromium

      - name: Raspar el MTPE y cargar en la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REGIONES: ${{ inputs.regiones || 'LOR,SMN,UCA' }}
          EMPLEO_TRABAJO: ${{ runner.temp }}/empleo
          PYTHONUNBUFFERED: "1"
        run: python EMPLEO/automatizacion/empleo_servidor.py --regiones "$REGIONES"

      - name: Guardar el Excel como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empleo
          path: ${{ runner.temp }}/empleo/*_empleo.xlsx
          retention-days: 30
          if-no-files-found: ignore
