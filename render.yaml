# Despliegue del API "Departamento de estudios BCRP-IQT" (FISCAL/api) en Render.
# La base de datos es Postgres en Neon: su cadena de conexión se pega en DATABASE_URL al crear el servicio.
services:
  - type: web
    name: estudios-bcrp-iqt
    runtime: docker
    rootDir: FISCAL/api        # el Dockerfile y el contexto de Docker son los de esta carpeta (valor por defecto)
    plan: starter
    region: virginia
    healthCheckPath: /salud    # cada cambio en main se vuelve a desplegar solo (valor por defecto)
    # solo se despliega cuando cambia la página (ahorra minutos de construcción: la factura queda en el plan Starter)
    buildFilter:
      paths:
        - FISCAL/api/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_USUARIO
        value: estudios
      - key: APP_CLAVE
        generateValue: true
      # botón «Actualizar desde el MEF»: token fine-grained de GitHub, solo este repositorio, Actions lectura y escritura
      - key: GITHUB_ACCIONES_TOKEN
        sync: false
